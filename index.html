<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071323">
<title>RouteX — Explore More</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
:root {
  --blue:#0878ff;
  --cyan:#42d9ff;
  --navy:#071323;
  --ink:#102347;
  --muted:#7384a4;
  --glass:rgba(9,22,39,.88);
  --line:rgba(255,255,255,.15);
}

* { box-sizing:border-box; }

html,body {
  width:100%;height:100%;margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--navy);
  overflow:hidden;
}

button,input { font:inherit; }
button { cursor:pointer; }

#map {
  position:absolute;
  inset:0;
  background:#172c35;
}

#map:after {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(3,13,24,.36),transparent 36%,transparent 68%,rgba(4,17,32,.08));
}

svg.icon {
  width:22px;height:22px;
  fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;
  stroke-linejoin:round;flex-shrink:0;
}

.top-area {
  position:absolute;
  z-index:5;
  top:calc(env(safe-area-inset-top) + 12px);
  left:12px;right:12px;
}

.searchbar {
  display:flex;align-items:center;gap:11px;
  min-height:68px;padding:10px 13px;
  border:1px solid rgba(255,255,255,.23);
  border-radius:23px;
  background:rgba(9,23,39,.88);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  box-shadow:0 12px 38px #0005;
  color:white;
}

.brand {
  display:flex;align-items:center;gap:8px;
  flex-shrink:0;padding-right:10px;
  border-right:1px solid #ffffff25;
}

.logo {
  width:44px;height:44px;
  display:grid;place-items:center;
  border-radius:15px;
  background:linear-gradient(145deg,#32dfff,#0878ff 55%,#804bff);
  box-shadow:0 0 23px #168dff50;
}

.logo svg { width:35px;height:35px; }

.brand-name {
  color:white;font-size:22px;
  font-weight:850;letter-spacing:-1px;
}

.brand-name span { color:#39c6ff; }

.brand-sub {
  color:#9caec4;font-size:9px;
  letter-spacing:1.6px;margin-top:2px;
}

.searchbox {
  flex:1;min-width:0;
  display:flex;align-items:center;gap:9px;
}

.searchbox .icon { color:#d4e5ff; }

.searchbox input {
  width:100%;min-width:0;
  border:0;outline:0;background:transparent;
  color:white;font-size:15px;
}

.searchbox input::placeholder { color:#c2cfdf; }

.icon-btn {
  width:38px;height:38px;
  display:grid;place-items:center;
  background:transparent;border:0;color:white;
}

.profile {
  width:47px;height:47px;flex-shrink:0;
  border:3px solid #1687ff;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#1c3d5d,#142034);
  color:#e4efff;
}

.profile svg { width:25px;height:25px; }

.chips {
  display:flex;gap:9px;
  margin-top:12px;
  overflow-x:auto;scrollbar-width:none;
}

.chips::-webkit-scrollbar { display:none; }

.chip {
  min-height:43px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  gap:9px;padding:0 16px;
  border:1px solid #ffffff30;
  border-radius:24px;
  background:rgba(10,23,39,.88);
  backdrop-filter:blur(18px);
  color:#f3f7ff;font-size:13px;font-weight:650;
}

.chip .icon { width:19px;height:19px; }

.chip.active {
  border:2px solid #208cff;
  background:rgba(5,42,78,.94);
  color:#4bbcff;
  box-shadow:0 0 22px #168bff22;
}

.suggestions {
  display:none;position:absolute;
  z-index:30;top:72px;left:0;right:0;
  max-height:45vh;overflow:auto;
  border:1px solid #ffffff20;
  border-radius:17px;background:#0d1b2d;
  box-shadow:0 15px 40px #0009;
  color:white;
}

.suggestions.show { display:block; }

.suggestion {
  display:flex;align-items:flex-start;gap:11px;
  width:100%;padding:13px;
  text-align:left;color:white;
  border:0;border-bottom:1px solid #ffffff12;
  background:transparent;
}

.suggestion:hover { background:#19304b; }

.suggestion .icon { color:#58b9ff; }

.suggestion strong { display:block;font-size:13px; }

.suggestion small {
  display:block;margin-top:4px;
  color:#a7b7ca;font-size:11px;line-height:1.4;
}

.map-actions {
  position:absolute;z-index:4;
  right:13px;top:190px;
  display:flex;flex-direction:column;gap:11px;
}

.round-action {
  width:51px;height:51px;
  display:grid;place-items:center;
  border:1px solid #ffffff25;
  border-radius:50%;
  background:rgba(8,22,38,.88);
  backdrop-filter:blur(15px);
  color:#e9f5ff;
  box-shadow:0 5px 18px #0004;
}

.round-action.active {
  color:#48c5ff;border-color:#249aff;
}

.round-action .icon { width:24px;height:24px; }

.location-dot {
  width:24px;height:24px;
  border:3px solid white;
  border-radius:50%;background:#0878ff;
  box-shadow:0 0 0 8px #168bff36,0 0 20px #168bff;
}

.location-cone {
  width:0;height:0;
  border-left:35px solid transparent;
  border-right:35px solid transparent;
  border-bottom:110px solid rgba(48,125,255,.2);
  transform:translateY(-45px);
  pointer-events:none;
}

.bottom-sheet {
  position:absolute;z-index:6;
  left:0;right:0;bottom:0;
  height:min(47vh,440px);
  min-height:300px;
  padding:10px 17px calc(env(safe-area-inset-bottom) + 76px);
  border-radius:34px 34px 0 0;
  background:linear-gradient(180deg,#f7fbff,#eaf3fd);
  color:var(--ink);
  box-shadow:0 -12px 45px #0002;
  overflow:auto;
  transition:height .28s ease;
}

.sheet-handle {
  width:42px;height:5px;border-radius:5px;
  background:#b8c7d8;margin:0 auto 16px;
}

.place-header {
  display:flex;align-items:center;gap:13px;
  margin-bottom:17px;
}

.place-photo {
  width:74px;height:74px;flex-shrink:0;
  border-radius:18px;overflow:hidden;
  background:linear-gradient(145deg,#2f8eaa,#95c6bd,#27486a);
  display:grid;place-items:center;color:white;
}

.place-photo svg { width:36px;height:36px; }

.place-heading { flex:1;min-width:0; }

.place-heading h1 {
  font-size:24px;letter-spacing:-.8px;
  margin:0 0 5px;font-weight:800;
}

.place-heading p {
  font-size:13px;color:var(--muted);
  margin:0;line-height:1.5;
}

.weather {
  display:flex;align-items:center;gap:8px;
  padding:11px;border:1px solid #dce9fb;
  border-radius:20px;background:#f0f6ff;
  flex-shrink:0;
}

.weather .icon { width:26px;height:26px;color:#f6b61d; }
.weather strong { font-size:16px;display:block; }
.weather small { display:block;color:#7788a4;margin-top:3px;font-size:10px; }

.places-card {
  padding:13px 12px 4px;
  border-radius:23px;
  background:rgba(255,255,255,.84);
  box-shadow:0 5px 24px #244e7910;
}

.places-heading {
  display:flex;align-items:center;gap:10px;
  margin-bottom:9px;
}

.places-heading .icon { color:var(--blue); }

.places-heading strong {
  flex:1;font-size:15px;
}

.view-all {
  border:0;background:transparent;
  color:#536a8d;font-size:12px;
  display:flex;align-items:center;gap:3px;
}

.route-stop {
  display:flex;align-items:center;gap:11px;
  padding:11px 0;
  border-bottom:1px solid #e0eaf6;
}

.route-stop:last-child { border-bottom:0; }

.stop-number {
  width:39px;height:39px;flex-shrink:0;
  border-radius:50%;display:grid;place-items:center;
  color:#0864e9;background:#dceaff;
  font-size:15px;font-weight:800;
}

.stop-info { flex:1;min-width:0; }

.stop-info strong {
  display:block;font-size:14px;
}

.stop-info small {
  display:block;margin-top:3px;
  font-size:12px;color:#7384a4;
}

.stop-distance { text-align:right; }

.stop-distance strong {
  display:block;font-size:13px;
}

.stop-distance small {
  display:block;margin-top:3px;
  color:#7c8da8;font-size:11px;
}

.stop-arrow { color:#7185a3; }

.route-info {
  display:none;margin-top:12px;padding:12px;
  border-radius:15px;background:#e2efff;
  color:#193b6d;font-size:12px;line-height:1.7;
}

.route-info.show { display:block; }

.bottom-nav {
  position:absolute;z-index:9;
  left:0;right:0;bottom:0;
  padding:9px 18px calc(env(safe-area-inset-bottom) + 5px);
  min-height:72px;
  display:flex;justify-content:space-around;align-items:center;
  border-top:1px solid #dfe9f5;
  background:rgba(249,252,255,.97);
  backdrop-filter:blur(20px);
}

.nav-item {
  min-width:75px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  padding:5px 13px;border:0;border-radius:18px;
  color:#74829a;background:transparent;
  font-size:11px;
}

.nav-item .icon { width:23px;height:23px; }

.nav-item.active { color:#086fff;font-weight:750; }

.nav-item.active .icon { stroke-width:2.4; }

.status-pill {
  position:absolute;z-index:4;
  top:146px;left:50%;transform:translateX(-50%);
  display:none;max-width:calc(100% - 40px);
  padding:9px 13px;border:1px solid #ffffff30;
  border-radius:20px;background:#08182bdd;
  color:#e9f5ff;font-size:11px;text-align:center;
  backdrop-filter:blur(15px);
}

.status-pill.show { display:block; }

body.navigation-mode .top-area,
body.navigation-mode .map-actions,
body.navigation-mode .bottom-sheet,
body.navigation-mode .bottom-nav {
  display:none;
}

body.navigation-mode #navOverlay { display:block; }

#navOverlay {
  display:none;position:absolute;z-index:10;
  top:calc(env(safe-area-inset-top) + 12px);
  left:12px;right:12px;
}

.nav-card {
  padding:16px;border-radius:20px;
  background:rgba(8,23,41,.94);
  color:white;border:1px solid #ffffff25;
  backdrop-filter:blur(20px);
}

.nav-card strong { font-size:17px; }
.nav-card p { font-size:12px;color:#c0d2e7;line-height:1.6; }

.nav-card button {
  padding:10px 14px;border:0;
  border-radius:11px;background:#0878ff;color:white;
  font-weight:700;
}

@media(min-width:700px) {
  .top-area { max-width:580px;left:20px;top:20px; }
  .map-actions { top:205px;right:20px; }
  .bottom-sheet {
    left:20px;bottom:20px;right:auto;
    width:410px;height:auto;max-height:65vh;
    border-radius:28px;padding-bottom:20px;
  }
  .bottom-nav {
    left:auto;right:20px;bottom:20px;
    width:270px;border-radius:22px;
    border:1px solid #ffffff35;
  }
}

@media(max-width:380px) {
  .brand-name { font-size:18px; }
  .brand-sub { font-size:8px; }
  .brand { gap:5px;padding-right:6px; }
  .logo { width:37px;height:37px; }
  .logo svg { width:29px;height:29px; }
  .searchbar { gap:7px;padding:8px; }
  .profile { width:39px;height:39px; }
  .chip { padding:0 12px;font-size:12px; }
  .bottom-sheet { padding-left:12px;padding-right:12px; }
  .place-heading h1 { font-size:21px; }
}
</style>
</head>

<body>

<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">
  <symbol id="logoIcon" viewBox="0 0 48 48">
    <path d="M24 4C13 4 5 12 5 23c0 8 5 13 10 19l9 5 9-10c5-6 10-11 10-19C43 12 35 4 24 4Z" fill="none" stroke="white" stroke-width="3.5"/>
    <circle cx="24" cy="18" r="6" fill="none" stroke="white" stroke-width="3"/>
    <path d="M16 34c0-5 3-8 8-8s8 3 8 8" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></symbol>
  <symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5L16 8Z"/></symbol>
  <symbol id="bookmark" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4Z"/></symbol>
  <symbol id="food" viewBox="0 0 24 24"><path d="M7 3v7M4 3v4a3 3 0 0 0 6 0V3M7 10v11M16 3v18M16 3c4 2 4 7 0 9"/></symbol>
  <symbol id="layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
  <symbol id="gps" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M9 18h3a3 3 0 0 0 3-3V9"/></symbol>
  <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></symbol>
  <symbol id="profile" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></symbol>
  <symbol id="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="close" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
  <symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></symbol>
</svg>

<div id="map"></div>

<header class="top-area">
  <div class="searchbar">
    <div class="brand">
      <div class="logo"><svg class="icon"><use href="#logoIcon"/></svg></div>
      <div>
        <div class="brand-name">Route<span>X</span></div>
        <div class="brand-sub">Explore More</div>
      </div>
    </div>

    <div class="searchbox">
      <svg class="icon"><use href="#search"/></svg>
      <input id="searchInput" placeholder="Search places" autocomplete="off">
      <div id="suggestions" class="suggestions"></div>
    </div>

    <button class="icon-btn" onclick="voiceSearch()" aria-label="Voice search">
      <svg class="icon"><use href="#mic"/></svg>
    </button>
    <button class="profile" onclick="showStatus('RouteX profile') " aria-label="Profile">
      <svg class="icon"><use href="#profile"/></svg>
    </button>
  </div>

  <div class="chips">
    <button class="chip active" id="exploreChip" onclick="setTab('explore')">
      <svg class="icon"><use href="#compass"/></svg>Explore
    </button>
    <button class="chip" id="savedChip" onclick="setTab('saved')">
      <svg class="icon"><use href="#bookmark"/></svg>Saved
    </button>
    <button class="chip" id="foodChip" onclick="setTab('food')">
      <svg class="icon"><use href="#food"/></svg>Food
    </button>
  </div>
</header>

<div class="map-actions">
  <button class="round-action" id="layersBtn" onclick="toggleMapType()" aria-label="Map layers">
    <svg class="icon"><use href="#layers"/></svg>
  </button>
  <button class="round-action" onclick="useMyLocation()" aria-label="My location">
    <svg class="icon"><use href="#gps"/></svg>
  </button>
  <button class="round-action" onclick="startNavigation()" aria-label="Start navigation">
    <svg class="icon"><use href="#route"/></svg>
  </button>
</div>

<div class="status-pill" id="statusPill" aria-live="polite"></div>

<section class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle" id="sheetHandle"></div>

  <div class="place-header">
    <div class="place-photo">
      <svg class="icon"><use href="#layers"/></svg>
    </div>

    <div class="place-heading">
      <h1 id="placeTitle">Explore nearby</h1>
      <p id="placeSubtitle">Punjab, India</p>
    </div>

    <div class="weather">
      <svg class="icon"><use href="#sun"/></svg>
      <div>
        <strong id="weatherTemp">--°</strong>
        <small id="weatherLabel">Weather</small>
      </div>
    </div>
  </div>

  <div class="places-card">
    <div class="places-heading">
      <svg class="icon"><use href="#route"/></svg>
      <strong id="routeListTitle">Places along your route</strong>
      <button class="view-all" onclick="toggleAllPlaces()">View all <svg class="icon" style="width:15px;height:15px"><use href="#chevron"/></svg></button>
    </div>

    <div id="placeList">
      <div class="route-stop">
        <div class="stop-number">1</div>
        <div class="stop-info"><strong>Starting point</strong><small>Choose a place on the map</small></div>
        <svg class="icon stop-arrow"><use href="#chevron"/></svg>
      </div>
      <div class="route-stop">
        <div class="stop-number">2</div>
        <div class="stop-info"><strong>Destination</strong><small>Search a place to begin</small></div>
        <svg class="icon stop-arrow"><use href="#chevron"/></svg>
      </div>
    </div>
  </div>

  <div class="route-info" id="routeInfo"></div>
</section>

<nav class="bottom-nav">
  <button class="nav-item active" id="navExplore" onclick="setTab('explore')">
    <svg class="icon"><use href="#compass"/></svg>Explore
  </button>
  <button class="nav-item" id="navSaved" onclick="setTab('saved')">
    <svg class="icon"><use href="#bookmark"/></svg>Saved
  </button>
  <button class="nav-item" id="navProfile" onclick="setTab('profile')">
    <svg class="icon"><use href="#profile"/></svg>Profile
  </button>
</nav>

<div id="navOverlay">
  <div class="nav-card">
    <strong>RouteX Navigation</strong>
    <p id="navInstruction">Your route will appear here.</p>
    <button onclick="stopNavigation()">Exit navigation</button>
  </div>
</div>

<script>
const TOMTOM_API_KEY = "YOUR_TOMTOM_API_KEY";

let map;
let currentPosition = null;
let currentMarker = null;
let destinationMarker = null;
let satelliteOn = true;
let trafficOn = false;
let navigationOn = false;
let allPlacesVisible = false;
let routeCoords = [];
let routeStops = [];
let searchTimer = null;
let placeRequestId = 0;

const $ = id => document.getElementById(id);

function showStatus(message) {
  const el=$("statusPill");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(showStatus.timer);
  showStatus.timer=setTimeout(()=>el.classList.remove("show"),4000);
}

map = new maplibregl.Map({
  container:"map",
  style:"https://tiles.openfreemap.org/styles/liberty",
  center:[76.53,30.97],
  zoom:11,
  attributionControl:false
});

map.addControl(new maplibregl.NavigationControl({showCompass:true}),"bottom-right");

map.on("load",()=>{
  map.addSource("satelliteSource",{
    type:"raster",
    tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
    tileSize:256,
    attribution:"Imagery © Esri"
  });

  map.addLayer({
    id:"satelliteLayer",
    type:"raster",
    source:"satelliteSource",
    layout:{visibility:"visible"},
    paint:{"raster-opacity":1}
  });

  map.addSource("routeSource",{
    type:"geojson",
    data:{type:"Feature",properties:{},geometry:{type:"LineString",coordinates:[]}}
  });

  map.addLayer({
    id:"routeGlow",
    type:"line",
    source:"routeSource",
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":"#0878ff","line-width":13,"line-opacity":0.35,"line-blur":4}
  });

  map.addLayer({
    id:"routeLine",
    type:"line",
    source:"routeSource",
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":"#0878ff","line-width":5}
  });

  addTrafficLayer();
  loadWeather();
  showStatus("RouteX is ready. Search a place.");
});

function addTrafficLayer() {
  if(!map.getSource("trafficSource")) {
    map.addSource("trafficSource",{
      type:"raster",
      tiles:[
        "https://api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key="+encodeURIComponent(TOMTOM_API_KEY)
      ],
      tileSize:256
    });

    map.addLayer({
      id:"trafficLayer",
      type:"raster",
      source:"trafficSource",
      layout:{visibility:"none"},
      paint:{"raster-opacity":0.8}
    },"routeGlow");
  }
}

async function loadWeather() {
  try {
    const c=currentPosition||[76.53,30.97];
    const response=await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude="+c[1]+"&longitude="+c[0]+"&current=temperature_2m,weather_code"
    );
    if(!response.ok) return;
    const data=await response.json();
    $("weatherTemp").textContent=Math.round(data.current.temperature_2m)+"°";
    const code=data.current.weather_code;
    $("weatherLabel").textContent=code===0?"Clear":code<4?"Cloudy":code<70?"Rain possible":"Weather";
  } catch(e) {
    $("weatherTemp").textContent="--°";
    $("weatherLabel").textContent="Weather unavailable";
  }
}

/* Location autocomplete */
$("searchInput").addEventListener("input",()=>{
  clearTimeout(searchTimer);
  const q=$("searchInput").value.trim();
  const box=$("suggestions");

  if(q.length<2) {
    box.classList.remove("show");
    box.innerHTML="";
    return;
  }

  box.innerHTML='<div class="suggestion">Searching locations...</div>';
  box.classList.add("show");

  searchTimer=setTimeout(()=>searchLocations(q),350);
});

async function searchLocations(q) {
  const box=$("suggestions");

  try {
    const response=await fetch(
      "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=7&q="+encodeURIComponent(q),
      {headers:{"Accept-Language":"en"}}
    );
    if(!response.ok) throw new Error("Search failed");

    const results=await response.json();
    box.innerHTML="";

    if(!results.length) {
      box.innerHTML='<div class="suggestion"><span>No locations found. Try another search.</span></div>';
      return;
    }

    results.forEach(place=>{
      const btn=document.createElement("button");
      btn.className="suggestion";
      btn.type="button";

      const icon=document.createElementNS("http://www.w3.org/2000/svg","svg");
      icon.setAttribute("class","icon");
      icon.innerHTML='<use href="#search"></use>';

      const text=document.createElement("div");
      const strong=document.createElement("strong");
      const small=document.createElement("small");

      strong.textContent=place.name||place.display_name.split(",")[0];
      small.textContent=place.display_name;
      text.append(strong,small);
      btn.append(icon,text);

      btn.addEventListener("click",()=>{
        box.classList.remove("show");
        $("searchInput").value=place.name||place.display_name;
        goToPlace(place);
      });

      box.appendChild(btn);
    });
  } catch(e) {
    box.innerHTML='<div class="suggestion">Search unavailable. Check your internet connection.</div>';
  }
}

document.addEventListener("click",e=>{
  if(!e.target.closest(".searchbar")&&!e.target.closest(".suggestions")) {
    $("suggestions").classList.remove("show");
  }
});

async function geocode(q) {
  const response=await fetch(
    "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+encodeURIComponent(q)
  );
  if(!response.ok) throw new Error("Location search failed.");
  const data=await response.json();
  if(!data.length) throw new Error("Location not found: "+q);
  return {name:data[0].name||data[0].display_name.split(",")[0],
    display:data[0].display_name,
    coords:[Number(data[0].lon),Number(data[0].lat)]};
}

async function goToPlace(place) {
  const coords=[Number(place.lon),Number(place.lat)];

  $("placeTitle").textContent=place.name||place.display_name.split(",")[0];
  $("placeSubtitle").textContent=place.display_name||"Selected location";

  map.flyTo({center:coords,zoom:14,duration:1200});

  if(destinationMarker) destinationMarker.remove();
  destinationMarker=new maplibregl.Marker({color:"#ff4567"})
    .setLngLat(coords).addTo(map);

  showStatus("Location selected. Enter a destination to find a route.");
}

function useMyLocation() {
  if(!navigator.geolocation) {
    showStatus("GPS is not supported by this browser.");
    return;
  }

  showStatus("Finding your current location...");

  navigator.geolocation.getCurrentPosition(position=>{
    currentPosition=[position.coords.longitude,position.coords.latitude];

    if(currentMarker) currentMarker.remove();

    const el=document.createElement("div");
    el.className="location-dot";

    currentMarker=new maplibregl.Marker({element:el})
      .setLngLat(currentPosition).addTo(map);

    map.flyTo({center:currentPosition,zoom:15,duration:1100});

    $("placeTitle").textContent="Your location";
    $("placeSubtitle").textContent="Current GPS position";
    loadWeather();

    showStatus("Your location is ready.");
  },()=>{
    showStatus("Allow location access in your browser settings and try again.");
  },{enableHighAccuracy:true,timeout:20000,maximumAge:5000});
}

/*
 * Build a full route from the current GPS location or a typed start point
 * to the searched destination.
 */
async function findRoute(startText,destText) {
  try {
    if(!destText) {
      showStatus("Search and select your destination first.");
      return;
    }

    let start;

    if(startText==="__CURRENT__") {
      if(!currentPosition) await new Promise((resolve,reject)=>{
        navigator.geolocation.getCurrentPosition(p=>{
          currentPosition=[p.coords.longitude,p.coords.latitude];
          resolve();
        },reject,{enableHighAccuracy:true,timeout:15000});
      });
      start={name:"Your location",coords:currentPosition};
    } else {
      start=await geocode(startText);
    }

    const destination=await geocode(destText);

    showStatus("Calculating the best route...");

    const url="https://router.project-osrm.org/route/v1/driving/"+
      start.coords.join(",")+";"+destination.coords.join(",")+
      "?overview=full&geometries=geojson&steps=true";

    const response=await fetch(url);
    if(!response.ok) throw new Error("Route service unavailable.");

    const data=await response.json();
    if(data.code!=="Ok"||!data.routes.length) throw new Error("No route found.");

    const route=data.routes[0];
    routeCoords=route.geometry.coordinates;

    map.getSource("routeSource").setData({
      type:"Feature",
      properties:{},
      geometry:route.geometry
    });

    if(destinationMarker) destinationMarker.remove();
    destinationMarker=new maplibregl.Marker({color:"#ff4567"})
      .setLngLat(destination.coords).addTo(map);

    const bounds=new maplibregl.LngLatBounds();
    routeCoords.forEach(c=>bounds.extend(c));

    map.fitBounds(bounds,{padding:{top:170,bottom:310,left:45,right:45},duration:1100});

    $("placeTitle").textContent=destination.name;
    $("placeSubtitle").textContent=destination.display;

    const km=(route.distance/1000).toFixed(1);
    const mins=Math.round(route.duration/60);

    $("routeInfo").innerHTML=
      "<strong>Route summary</strong><br>"+
      "Distance: "+km+" km<br>"+
      "Estimated driving time: "+mins+" minutes";
    $("routeInfo").classList.add("show");

    $("navInstruction").textContent="Follow the blue route towards "+destination.name+".";
    showStatus("Route ready: "+km+" km · "+mins+" min");

    await getPlacesAlongRoute(routeCoords,start,destination,route);
  } catch(e) {
    showStatus(e.message||"Unable to calculate route.");
  }
}

function interpolateRoute(coords,fraction) {
  const index=Math.max(0,Math.min(coords.length-1,Math.floor(fraction*(coords.length-1))));
  return coords[index];
}

/*
 * Look for named towns, villages and landmarks close to route samples.
 * The result is approximate because public map data varies by region.
 */
async function getPlacesAlongRoute(coords,start,destination,route) {
  const request=++placeRequestId;
  const list=$("placeList");

  list.innerHTML='<div class="route-stop"><div class="stop-info"><strong>Finding places...</strong><small>Checking nearby towns and villages</small></div></div>';

  const samples=[];
  const count=Math.min(6,Math.max(2,Math.floor(coords.length/80)+1));

  for(let i=1;i<count;i++) {
    const p=interpolateRoute(coords,i/count);
    if(!samples.some(s=>Math.abs(s[0]-p[0])<0.025&&Math.abs(s[1]-p[1])<0.025)) {
      samples.push(p);
    }
  }

  const places=new Map();

  try {
    for(const point of samples) {
      if(request!==placeRequestId) return;

      const q=`[out:json][timeout:12];(
        node(around:3500,${point[1]},${point[0]})["place"~"city|town|village|suburb|hamlet"]["name"];
        way(around:3500,${point[1]},${point[0]})["place"~"city|town|village|suburb|hamlet"]["name"];
      );out center tags;`;

      try {
        const res=await fetch("https://overpass-api.de/api/interpreter",{
          method:"POST",
          headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
          body:"data="+encodeURIComponent(q)
        });
        if(!res.ok) continue;

        const data=await res.json();

        (data.elements||[]).forEach(el=>{
          const name=el.tags?.name||el.tags?.["name:en"];
          const lon=el.lon??el.center?.lon;
          const lat=el.lat??el.center?.lat;
          if(!name||lon==null||lat==null) return;

          const key=name.toLowerCase();
          if(!places.has(key)) places.set(key,{
            name,
            type:el.tags?.place||"Place",
            coords:[lon,lat]
          });
        });
      } catch(e) {
        // Keep any places already found if a sample request fails.
      }
    }

    if(request!==placeRequestId) return;

    const stops=[{
      name:start.name||"Starting point",
      type:"Start",
      coords:start.coords,
      km:0
    }];

    [...places.values()].forEach(p=>{
      const routeIndex=nearestRouteIndex(p.coords,coords);
      if(routeIndex<0) return;

      const km=routeDistance(coords,routeIndex);
      const totalKm=route.distance/1000;

      if(km>1 && km<totalKm-1) {
        stops.push({...p,km});
      }
    });

    stops.sort((a,b)=>a.km-b.km);

    const unique=[];
    stops.forEach(p=>{
      if(!unique.some(u=>u.name.toLowerCase()===p.name.toLowerCase())) unique.push(p);
    });

    unique.push({
      name:destination.name||"Destination",
      type:"Destination",
      coords:destination.coords,
      km:route.distance/1000
    });

    routeStops=unique;
    renderStops(route.duration);
  } catch(e) {
    if(request!==placeRequestId) return;

    routeStops=[
      {name:start.name||"Starting point",type:"Start",coords:start.coords,km:0},
      {name:destination.name||"Destination",type:"Destination",coords:destination.coords,km:route.distance/1000}
    ];
    renderStops(route.duration);
  }
}

function nearestRouteIndex(point,coords) {
  let best=-1,bestD=Infinity;

  for(let i=0;i<coords.length;i+=Math.max(1,Math.floor(coords.length/500))) {
    const d=Math.hypot((coords[i][0]-point[0])*85,(coords[i][1]-point[1])*111);
    if(d<bestD) {bestD=d;best=i;}
  }

  return bestD<5?best:-1;
}

function routeDistance(coords,index) {
  let metres=0;
  for(let i=1;i<=index;i++) {
    const a=coords[i-1],b=coords[i];
    const dx=(b[0]-a[0])*85000;
    const dy=(b[1]-a[1])*111000;
    metres+=Math.hypot(dx,dy);
  }
  return metres/1000;
}

function renderStops(totalDuration=0) {
  const list=$("placeList");
  list.innerHTML="";

  const visible=allPlacesVisible?routeStops:routeStops.slice(0,4);

  visible.forEach((stop,index)=>{
    const row=document.createElement("div");
    row.className="route-stop";

    const num=document.createElement("div");
    num.className="stop-number";
    num.textContent=index+1;

    const info=document.createElement("div");
    info.className="stop-info";

    const name=document.createElement("strong");
    name.textContent=stop.name;

    const type=document.createElement("small");
    type.textContent=stop.type.charAt(0).toUpperCase()+stop.type.slice(1);

    info.append(name,type);

    const distance=document.createElement("div");
    distance.className="stop-distance";

    const km=document.createElement("strong");
    km.textContent=Math.round(stop.km)+" km";

    const mins=document.createElement("small");
    mins.textContent="Along route";

    distance.append(km,mins);

    const arrow=document.createElementNS("http://www.w3.org/2000/svg","svg");
    arrow.setAttribute("class","icon stop-arrow");
    arrow.innerHTML='<use href="#chevron"></use>';

    row.append(num,info,distance,arrow);

    row.addEventListener("click",()=>{
      map.flyTo({center:stop.coords,zoom:13,duration:700});
    });

    list.appendChild(row);
  });

  $("routeListTitle").textContent="Places along your route";
}

function toggleAllPlaces() {
  allPlacesVisible=!allPlacesVisible;
  renderStops();
}

function toggleMapType() {
  if(!map.getLayer("satelliteLayer")) return;

  satelliteOn=!satelliteOn;
  map.setLayoutProperty("satelliteLayer","visibility",satelliteOn?"visible":"none");
  $("layersBtn").classList.toggle("active",satelliteOn);

  showStatus(satelliteOn?"Satellite view enabled.":"Default map enabled.");
}

function toggleTraffic() {
  if(!map.getLayer("trafficLayer")) return;

  trafficOn=!trafficOn;
  map.setLayoutProperty("trafficLayer","visibility",trafficOn?"visible":"none");
  showStatus(trafficOn
    ?"Traffic layer enabled. A valid TomTom key is required."
    :"Traffic layer disabled.");
}

function startNavigation() {
  if(!routeCoords.length) {
    showStatus("Find a route before starting navigation.");
    return;
  }

  navigationOn=true;
  document.body.classList.add("navigation-mode");

  $("navInstruction").textContent="Follow the blue route. Enable GPS for live location tracking.";

  if(navigator.geolocation) {
    navigator.geolocation.watchPosition(position=>{
      currentPosition=[position.coords.longitude,position.coords.latitude];

      if(!currentMarker) {
        const el=document.createElement("div");
        el.className="location-dot";
        currentMarker=new maplibregl.Marker({element:el}).setLngLat(currentPosition).addTo(map);
      } else {
        currentMarker.setLngLat(currentPosition);
      }

      if(navigationOn) map.easeTo({center:currentPosition,duration:800});
    },()=>{},{
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:15000
    });
  }
}

function stopNavigation() {
  navigationOn=false;
  document.body.classList.remove("navigation-mode");
  showStatus("Navigation view closed.");
}

function setTab(tab) {
  ["explore","saved","food"].forEach(name=>{
    $(name+"Chip").classList.toggle("active",name===tab);
  });

  ["explore","saved","profile"].forEach(name=>{
    $("nav"+name.charAt(0).toUpperCase()+name.slice(1))
      .classList.toggle("active",name===tab);
  });

  if(tab==="saved") {
    showStatus("Saved places feature is ready for future integration.");
  } else if(tab==="food") {
    $("searchInput").value="Restaurants";
    showStatus("Search a town or area to find food places.");
  } else if(tab==="profile") {
    showStatus("RouteX profile.");
  } else {
    showStatus("Explore places with RouteX.");
  }
}

function voiceSearch() {
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SpeechRecognition) {
    showStatus("Voice search is not supported in this browser. Type your search instead.");
    return;
  }

  const recognition=new SpeechRecognition();
  recognition.lang="en-IN";
  recognition.onresult=event=>{
    const text=event.results[0][0].transcript;
    $("searchInput").value=text;
    $("searchInput").dispatchEvent(new Event("input"));
  };
  recognition.onerror=()=>showStatus("Voice search could not start.");
  recognition.start();
}

/* Swipe the bottom sheet to expand or collapse it on mobile. */
let touchStartY=0;

$("sheetHandle").addEventListener("touchstart",e=>{
  touchStartY=e.touches[0].clientY;
},{passive:true});

$("sheetHandle").addEventListener("touchend",e=>{
  const delta=e.changedTouches[0].clientY-touchStartY;
  const sheet=$("bottomSheet");

  if(delta<-35) {
    sheet.style.height="min(75vh,720px)";
  } else if(delta>35) {
    sheet.style.height="min(47vh,440px)";
  }
},{passive:true});
</script>
