<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RouteX | Smart Navigation</title>

<link
  href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
  rel="stylesheet"
/>

<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  overflow: hidden;
}

#map {
  position: absolute;
  inset: 0;
}

.panel {
  position: absolute;
  z-index: 5;
  top: 14px;
  left: 14px;
  width: min(390px, calc(100% - 28px));
  padding: 17px;
  background: rgba(15, 23, 42, 0.97);
  border: 1px solid #334155;
  border-radius: 18px;
  box-shadow: 0 10px 35px #0005;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.logo {
  color: #60a5fa;
  font-size: 27px;
  font-weight: 800;
}

.tagline {
  color: #94a3b8;
  font-size: 10px;
  letter-spacing: 1px;
}

.field-label {
  display: block;
  color: #cbd5e1;
  font-size: 12px;
  margin: 10px 0 5px;
}

input {
  width: 100%;
  min-width: 0;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #475569;
  background: #1e293b;
  color: white;
  font-size: 14px;
  outline: none;
}

input:focus {
  border-color: #60a5fa;
}

input::placeholder {
  color: #94a3b8;
}

.start-row {
  display: flex;
  gap: 7px;
}

.start-row input {
  flex: 1;
}

button {
  border: none;
  border-radius: 10px;
  padding: 11px;
  background: #334155;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

.location-btn {
  background: #164e8a;
  white-space: nowrap;
  font-size: 12px;
}

.primary-btn {
  width: 100%;
  background: #2563eb;
  margin-top: 12px;
  padding: 13px;
  font-size: 15px;
}

.button-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 9px;
}

.button-grid button {
  font-size: 12px;
}

.traffic-btn {
  background: #166534;
}

.status {
  margin-top: 12px;
  padding: 10px;
  background: #1e293b;
  border-radius: 10px;
  color: #cbd5e1;
  font-size: 12px;
  line-height: 1.6;
}

.legend {
  margin-top: 9px;
  padding: 10px;
  background: #1e293b;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.9;
}

.legend-title {
  font-weight: 700;
  margin-bottom: 3px;
}

.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 6px;
}

.bottom-bar {
  position: absolute;
  z-index: 4;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  width: max-content;
  max-width: calc(100% - 20px);
}

.bottom-bar button {
  box-shadow: 0 5px 20px #0005;
  font-size: 12px;
}

#reopenBtn {
  display: none;
  position: absolute;
  z-index: 8;
  top: 14px;
  left: 14px;
  background: #0f172a;
  border: 1px solid #475569;
}

#navBanner {
  display: none;
  position: absolute;
  z-index: 4;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  width: min(340px, calc(100% - 100px));
  padding: 14px;
  text-align: center;
  background: #0f172a;
  border-radius: 14px;
  box-shadow: 0 5px 20px #0005;
}

#navBanner p {
  margin-top: 6px;
  color: #cbd5e1;
  font-size: 12px;
  line-height: 1.5;
}

body.nav-mode .panel {
  display: none;
}

body.nav-mode #reopenBtn,
body.nav-mode #navBanner {
  display: block;
}

@media (max-width: 450px) {
  .panel {
    top: 8px;
    left: 8px;
    width: calc(100% - 16px);
    padding: 13px;
  }

  .logo {
    font-size: 23px;
  }

  .location-btn {
    font-size: 11px;
    padding: 10px 8px;
  }

  .bottom-bar {
    bottom: 12px;
    gap: 5px;
  }

  .bottom-bar button {
    padding: 10px 8px;
    font-size: 11px;
  }

  .legend {
    line-height: 1.7;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<section class="panel">

  <div class="header">
    <div class="logo">🚘 RouteX</div>
    <div class="tagline">SMART NAVIGATION</div>
  </div>

  <label class="field-label" for="start">
    Starting point
  </label>

  <div class="start-row">
    <input
      id="start"
      placeholder="Enter starting location"
      autocomplete="off"
    />

    <button
      class="location-btn"
      onclick="useMyLocation()"
      type="button"
    >
      📍 Use Current Location
    </button>
  </div>

  <label class="field-label" for="destination">
    Destination
  </label>

  <input
    id="destination"
    placeholder="Where do you want to go?"
    autocomplete="off"
  />

  <button class="primary-btn" onclick="findRoute()">
    🔎 Find Route
  </button>

  <div class="button-grid">
    <button onclick="useMyLocation()">
      📍 My Location
    </button>

    <button onclick="toggle3D()">
      🏙️ 2D / 3D
    </button>

    <button class="traffic-btn" onclick="toggleTraffic()">
      🚦 Traffic On / Off
    </button>

    <button onclick="toggleFullscreen()">
      ⛶ Full Screen
    </button>
  </div>

  <div class="legend">
    <div class="legend-title">🚦 Traffic conditions</div>
    <div>
      <span class="dot" style="background:#36d66b"></span>
      Smooth traffic
    </div>
    <div>
      <span class="dot" style="background:#ffe14b"></span>
      Slow traffic
    </div>
    <div>
      <span class="dot" style="background:#ff8c35"></span>
      Heavy traffic
    </div>
    <div>
      <span class="dot" style="background:#ff3939"></span>
      Traffic jam
    </div>
  </div>

  <div class="status" id="status" aria-live="polite">
    Enter a destination or tap Use Current Location to begin.
  </div>

</section>

<button id="reopenBtn" onclick="toggleNavigationPanel()">
  ☰ RouteX
</button>

<div id="navBanner">
  <b>🧭 RouteX Navigation</b>
  <p id="navStatus">Your route will appear here.</p>
</div>

<div class="bottom-bar">
  <button onclick="toggleNavigationPanel()">
    🧭 Navigation View
  </button>

  <button onclick="stopNavigation()">
    ✖ Stop
  </button>
</div>

<script>
/*
  REAL TRAFFIC:
  Get a TomTom API key and replace the placeholder below.
  Never share your key publicly.
*/

const TOMTOM_API_KEY = "YOUR_TOMTOM_API_KEY";

const statusBox = document.getElementById("status");
const navStatus = document.getElementById("navStatus");

let currentPosition = null;
let locationMarker = null;
let destinationMarker = null;
let routeCoordinates = [];
let watchId = null;
let trafficVisible = true;
let is3D = false;
let mapReady = false;
let navigationActive = false;

const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/liberty",
  center: [76.53, 30.97],
  zoom: 10
});

map.addControl(
  new maplibregl.NavigationControl(),
  "bottom-right"
);

map.addControl(
  new maplibregl.ScaleControl(),
  "bottom-right"
);

function setStatus(message) {
  statusBox.textContent = message;
  navStatus.textContent = message;
}

map.on("load", () => {
  mapReady = true;

  // Traffic overlay
  map.addSource("trafficFlow", {
    type: "raster",
    tiles: [
      "https://api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=" +
      encodeURIComponent(TOMTOM_API_KEY)
    ],
    tileSize: 256,
    attribution: "Traffic data © TomTom"
  });

  map.addLayer({
    id: "trafficFlowLayer",
    type: "raster",
    source: "trafficFlow",
    layout: {
      visibility: "visible"
    },
    paint: {
      "raster-opacity": 0.75
    }
  });

  // Route source
  map.addSource("routeSource", {
    type: "geojson",
    data: {
      type: "Feature",
      properties: {},
      geometry: {
        type: "LineString",
        coordinates: []
      }
    }
  });

  // Blue route glow
  map.addLayer({
    id: "routeGlow",
    type: "line",
    source: "routeSource",
    layout: {
      "line-cap": "round",
      "line-join": "round"
    },
    paint: {
      "line-color": "#1685ff",
      "line-width": 12,
      "line-opacity": 0.3,
      "line-blur": 3
    }
  });

  // Main route line
  map.addLayer({
    id: "routeLine",
    type: "line",
    source: "routeSource",
    layout: {
      "line-cap": "round",
      "line-join": "round"
    },
    paint: {
      "line-color": "#1685ff",
      "line-width": 5
    }
  });
});

async function geocode(place) {
  const url =
    "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
    encodeURIComponent(place);

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Location search failed. Please try again.");
  }

  const results = await response.json();

  if (!results.length) {
    throw new Error("Location not found: " + place);
  }

  return [
    Number(results[0].lon),
    Number(results[0].lat)
  ];
}

// CURRENT LOCATION BUTTON
function useMyLocation() {
  if (!navigator.geolocation) {
    setStatus("Your browser does not support GPS location.");
    return;
  }

  setStatus("📍 Finding your current location...");

  navigator.geolocation.getCurrentPosition(
    position => {
      currentPosition = [
        position.coords.longitude,
        position.coords.latitude
      ];

      document.getElementById("start").value = "My Location";

      showLocation(currentPosition);

      map.flyTo({
        center: currentPosition,
        zoom: 16,
        pitch: is3D ? 55 : 0,
        duration: 1200
      });

      setStatus(
        "📍 Your current location is ready. Enter a destination to find a route."
      );
    },

    error => {
      setStatus(
        "Could not get your location. Allow location permission and try again."
      );
    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 5000
    }
  );
}

// BLUE DOT FOR CURRENT LOCATION
function showLocation(coords) {
  if (locationMarker) {
    locationMarker.setLngLat(coords);
    return;
  }

  const el = document.createElement("div");

  el.style.width = "22px";
  el.style.height = "22px";
  el.style.borderRadius = "50%";
  el.style.background = "#1685ff";
  el.style.border = "4px solid white";
  el.style.boxShadow =
    "0 0 0 8px #1685ff44, 0 0 20px #1685ff";

  locationMarker = new maplibregl.Marker({
    element: el
  })
    .setLngLat(coords)
    .addTo(map);
}

// FIND ROUTE
async function findRoute() {
  if (!mapReady) {
    setStatus("Map is loading. Please wait a moment.");
    return;
  }

  const startText = document.getElementById("start").value.trim();
  const destinationText =
    document.getElementById("destination").value.trim();

  if (!startText || !destinationText) {
    setStatus("Enter a starting point and destination first.");
    return;
  }

  setStatus("🔎 Finding locations and calculating your route...");

  try {
    let start;

    // Use actual GPS coordinates when current location was selected.
    if (
      startText.toLowerCase() === "my location" &&
      currentPosition
    ) {
      start = currentPosition;
    } else {
      start = await geocode(startText);
    }

    const destination = await geocode(destinationText);

    const routeURL =
      "https://router.project-osrm.org/route/v1/driving/" +
      start.join(",") + ";" +
      destination.join(",") +
      "?overview=full&geometries=geojson&steps=true";

    const response = await fetch(routeURL);

    if (!response.ok) {
      throw new Error("Route service is unavailable. Try again later.");
    }

    const data = await response.json();

    if (data.code !== "Ok" || !data.routes?.length) {
      throw new Error("No driving route found for these locations.");
    }

    const route = data.routes[0];
    routeCoordinates = route.geometry.coordinates;

    map.getSource("routeSource").setData({
      type: "Feature",
      properties: {},
      geometry: route.geometry
    });

    if (destinationMarker) {
      destinationMarker.remove();
    }

    destinationMarker = new maplibregl.Marker({
      color: "#ef4444"
    })
      .setLngLat(destination)
      .setPopup(
        new maplibregl.Popup().setText("Destination")
      )
      .addTo(map);

    const bounds = new maplibregl.LngLatBounds();

    routeCoordinates.forEach(point => bounds.extend(point));

    map.fitBounds(bounds, {
      padding: window.innerWidth < 500 ? 45 : 90,
      duration: 1200
    });

    const distance = (route.distance / 1000).toFixed(1);
    const minutes = Math.round(route.duration / 60);

    setStatus(
      "✅ Route found: " + distance +
      " km • Estimated driving time: " + minutes +
      " minutes. GPS navigation can now follow your location."
    );

    startNavigation();

  } catch (error) {
    setStatus(error.message || "Unable to calculate route.");
  }
}

// LIVE GPS TRACKING
function startNavigation() {
  navigationActive = true;

  document.body.classList.add("nav-mode");

  if (!navigator.geolocation) {
    setStatus("Route ready, but GPS is not supported by this browser.");
    return;
  }

  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
  }

  watchId = navigator.geolocation.watchPosition(
    position => {
      currentPosition = [
        position.coords.longitude,
        position.coords.latitude
      ];

      showLocation(currentPosition);

      if (navigationActive) {
        map.easeTo({
          center: currentPosition,
          duration: 700
        });
      }
    },

    error => {
      setStatus(
        "Route is ready, but live GPS is unavailable. Check browser permissions."
      );
    },

    {
      enableHighAccuracy: true,
      maximumAge: 3000,
      timeout: 15000
    }
  );
}

// TRAFFIC ON / OFF
function toggleTraffic() {
  if (!mapReady || !map.getLayer("trafficFlowLayer")) {
    setStatus("Map is still loading. Try again shortly.");
    return;
  }

  trafficVisible = !trafficVisible;

  map.setLayoutProperty(
    "trafficFlowLayer",
    "visibility",
    trafficVisible ? "visible" : "none"
  );

  setStatus(
    trafficVisible
      ? "Traffic overlay enabled. A valid TomTom key is required for real traffic data."
      : "Traffic overlay is switched off."
  );
}

// 2D / 3D
function toggle3D() {
  is3D = !is3D;

  map.easeTo({
    pitch: is3D ? 55 : 0,
    duration: 1000
  });
}

// FULL SCREEN
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}

// MINIMAL NAVIGATION VIEW
function toggleNavigationPanel() {
  document.body.classList.toggle("nav-mode");
}

// STOP GPS NAVIGATION
function stopNavigation() {
  navigationActive = false;

  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  document.body.classList.remove("nav-mode");

  setStatus("Navigation stopped. You can search for another route.");
}
</script>

</body>
</html>
