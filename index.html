<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RouteX - Smart Navigation</title>

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  overflow: hidden;
}

#map {
  position: absolute;
  inset: 0;
}

.panel {
  position: absolute;
  z-index: 5;
  top: 12px;
  left: 12px;
  width: min(390px, calc(100% - 24px));
  padding: 16px;
  background: rgba(15, 23, 42, .97);
  border: 1px solid #334155;
  border-radius: 18px;
  box-shadow: 0 8px 30px #0005;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  color: #60a5fa;
}

.tagline {
  color: #94a3b8;
  font-size: 10px;
}

label {
  display: block;
  margin: 10px 0 5px;
  font-size: 12px;
  color: #cbd5e1;
}

input {
  width: 100%;
  min-width: 0;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #475569;
  background: #1e293b;
  color: white;
  font-size: 14px;
}

input::placeholder {
  color: #94a3b8;
}

.start-row {
  display: flex;
  gap: 7px;
}

.start-row input {
  flex: 1;
}

button {
  border: 0;
  padding: 11px;
  border-radius: 10px;
  background: #334155;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

.location-btn {
  background: #164e8a;
  font-size: 11px;
  white-space: nowrap;
}

.primary {
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  background: #2563eb;
  font-size: 15px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 9px;
}

.grid button {
  font-size: 12px;
}

.traffic-btn {
  background: #166534;
}

.satellite-btn {
  background: #854d0e;
}

.status {
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  background: #1e293b;
  color: #cbd5e1;
  font-size: 12px;
  line-height: 1.6;
}

.legend {
  margin-top: 9px;
  padding: 10px;
  border-radius: 10px;
  background: #1e293b;
  font-size: 12px;
  line-height: 1.8;
}

.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 5px;
}

.bottom-bar {
  position: absolute;
  z-index: 4;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 7px;
  max-width: calc(100% - 16px);
}

.bottom-bar button {
  white-space: nowrap;
  font-size: 11px;
  box-shadow: 0 4px 15px #0005;
}

#reopenBtn {
  display: none;
  position: absolute;
  z-index: 8;
  top: 12px;
  left: 12px;
  background: #0f172a;
}

#navBanner {
  display: none;
  position: absolute;
  z-index: 4;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: min(330px, calc(100% - 95px));
  background: #0f172a;
  padding: 14px;
  border-radius: 14px;
  text-align: center;
}

#navBanner p {
  font-size: 12px;
  color: #cbd5e1;
  margin-top: 6px;
}

body.nav-mode .panel {
  display: none;
}

body.nav-mode #reopenBtn,
body.nav-mode #navBanner {
  display: block;
}

@media(max-width:450px) {
  .panel {
    top: 7px;
    left: 7px;
    width: calc(100% - 14px);
    padding: 12px;
  }

  .logo {
    font-size: 23px;
  }

  .location-btn {
    padding: 9px 7px;
  }

  .bottom-bar {
    bottom: 10px;
    gap: 4px;
  }

  .bottom-bar button {
    padding: 10px 7px;
    font-size: 10px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<section class="panel">
  <div class="header">
    <div class="logo">🚘 RouteX</div>
    <div class="tagline">SMART NAVIGATION</div>
  </div>

  <label for="start">Starting Point</label>

  <div class="start-row">
    <input id="start" placeholder="Enter starting location">

    <button class="location-btn" onclick="useMyLocation()">
      📍 Current Location
    </button>
  </div>

  <label for="destination">Destination</label>
  <input id="destination" placeholder="Where do you want to go?">

  <button class="primary" onclick="findRoute()">
    🔎 Find Route
  </button>

  <div class="grid">
    <button onclick="useMyLocation()">📍 My Location</button>
    <button onclick="toggle3D()">🏙️ 2D / 3D</button>
    <button class="satellite-btn" onclick="toggleSatellite()">🛰️ Satellite</button>
    <button class="traffic-btn" onclick="toggleTraffic()">🚦 Traffic On/Off</button>
    <button onclick="toggleFullscreen()">⛶ Full Screen</button>
    <button onclick="clearRoute()">🗑️ Clear Route</button>
  </div>

  <div class="legend">
    <b>🚦 Traffic Conditions</b><br>
    <span class="dot" style="background:#36d66b"></span> Smooth traffic<br>
    <span class="dot" style="background:#ffe14b"></span> Slow traffic<br>
    <span class="dot" style="background:#ff8c35"></span> Heavy traffic<br>
    <span class="dot" style="background:#ff3939"></span> Traffic jam
  </div>

  <div class="status" id="status" aria-live="polite">
    Tap Current Location or enter your route.
  </div>
</section>

<button id="reopenBtn" onclick="toggleNavigationPanel()">☰ RouteX</button>

<div id="navBanner">
  <b>🧭 RouteX Navigation</b>
  <p id="navStatus">Ready for navigation.</p>
</div>

<div class="bottom-bar">
  <button onclick="toggleNavigationPanel()">🧭 Navigation View</button>
  <button onclick="stopNavigation()">✖ Stop</button>
</div>

<script>
/*
  Add your TomTom API key here for real traffic.
  Satellite imagery uses Esri World Imagery.
*/

const TOMTOM_API_KEY = "YOUR_TOMTOM_API_KEY";

let mapReady = false;
let currentPosition = null;
let locationMarker = null;
let destinationMarker = null;
let watchId = null;
let navigationActive = false;
let trafficVisible = true;
let satelliteMode = false;
let is3D = false;

const statusBox = document.getElementById("status");
const navStatus = document.getElementById("navStatus");

function setStatus(message) {
  statusBox.textContent = message;
  navStatus.textContent = message;
}

const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/liberty",
  center: [76.53, 30.97],
  zoom: 10
});

map.addControl(new maplibregl.NavigationControl(), "bottom-right");
map.addControl(new maplibregl.ScaleControl(), "bottom-right");

map.on("load", () => {
  mapReady = true;

  // Satellite imagery source
  map.addSource("satelliteSource", {
    type: "raster",
    tiles: [
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
    ],
    tileSize: 256,
    attribution: "Imagery © Esri"
  });

  // Start hidden: normal map is initially visible.
  map.addLayer({
    id: "satelliteLayer",
    type: "raster",
    source: "satelliteSource",
    layout: {
      visibility: "none"
    },
    paint: {
      "raster-opacity": 1
    }
  });

  // Real traffic layer. Requires a valid TomTom key.
  map.addSource("trafficSource", {
    type: "raster",
    tiles: [
      "https://api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=" +
      encodeURIComponent(TOMTOM_API_KEY)
    ],
    tileSize: 256,
    attribution: "Traffic data © TomTom"
  });

  map.addLayer({
    id: "trafficLayer",
    type: "raster",
    source: "trafficSource",
    layout: {
      visibility: "visible"
    },
    paint: {
      "raster-opacity": 0.8
    }
  });

  // Route source
  map.addSource("routeSource", {
    type: "geojson",
    data: {
      type: "Feature",
      properties: {},
      geometry: {
        type: "LineString",
        coordinates: []
      }
    }
  });

  map.addLayer({
    id: "routeGlow",
    type: "line",
    source: "routeSource",
    layout: {
      "line-cap": "round",
      "line-join": "round"
    },
    paint: {
      "line-color": "#1677ff",
      "line-width": 12,
      "line-opacity": 0.3,
      "line-blur": 3
    }
  });

  map.addLayer({
    id: "routeLine",
    type: "line",
    source: "routeSource",
    layout: {
      "line-cap": "round",
      "line-join": "round"
    },
    paint: {
      "line-color": "#1677ff",
      "line-width": 5
    }
  });
});

// Get coordinates from a place name
async function geocode(place) {
  const url =
    "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
    encodeURIComponent(place);

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Location search failed. Please try again.");
  }

  const results = await response.json();

  if (!results.length) {
    throw new Error("Location not found: " + place);
  }

  return [Number(results[0].lon), Number(results[0].lat)];
}

// Show current location on the map
function showLocation(coords) {
  if (locationMarker) {
    locationMarker.setLngLat(coords);
    return;
  }

  const element = document.createElement("div");

  element.style.cssText = `
    width:22px;
    height:22px;
    border-radius:50%;
    background:#1685ff;
    border:4px solid white;
    box-shadow:0 0 0 8px #1685ff44, 0 0 20px #1685ff;
  `;

  locationMarker = new maplibregl.Marker({ element })
    .setLngLat(coords)
    .addTo(map);
}

// Current GPS location
function useMyLocation() {
  if (!navigator.geolocation) {
    setStatus("GPS is not supported by this browser.");
    return;
  }

  setStatus("📍 Finding your current location...");

  navigator.geolocation.getCurrentPosition(
    position => {
      currentPosition = [
        position.coords.longitude,
        position.coords.latitude
      ];

      document.getElementById("start").value = "My Location";

      showLocation(currentPosition);

      map.flyTo({
        center: currentPosition,
        zoom: 16,
        pitch: is3D ? 55 : 0,
        duration: 1200
      });

      setStatus("Current location found. Enter a destination to continue.");
    },
    error => {
      if (error.code === 1) {
        setStatus("Location permission denied. Allow GPS access in your browser.");
      } else if (error.code === 2) {
        setStatus("Location unavailable. Check GPS and internet connection.");
      } else if (error.code === 3) {
        setStatus("GPS request timed out. Try again.");
      } else {
        setStatus("Unable to get your location.");
      }
    },
    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 5000
    }
  );
}

// Calculate and display route
async function findRoute() {
  if (!mapReady) {
    setStatus("Map is loading. Please wait.");
    return;
  }

  const startText = document.getElementById("start").value.trim();
  const destinationText = document.getElementById("destination").value.trim();

  if (!startText || !destinationText) {
    setStatus("Enter both a starting point and destination.");
    return;
  }

  setStatus("🔎 Calculating route...");

  try {
    let start;

    if (
      startText.toLowerCase() === "my location" &&
      currentPosition
    ) {
      start = currentPosition;
    } else {
      start = await geocode(startText);
    }

    const destination = await geocode(destinationText);

    const url =
      "https://router.project-osrm.org/route/v1/driving/" +
      start.join(",") + ";" +
      destination.join(",") +
      "?overview=full&geometries=geojson&steps=true";

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Route service unavailable. Try again later.");
    }

    const data = await response.json();

    if (data.code !== "Ok" || !data.routes.length) {
      throw new Error("No driving route found.");
    }

    const route = data.routes[0];

    map.getSource("routeSource").setData({
      type: "Feature",
      properties: {},
      geometry: route.geometry
    });

    if (destinationMarker) {
      destinationMarker.remove();
    }

    destinationMarker = new maplibregl.Marker({ color: "#ef4444" })
      .setLngLat(destination)
      .setPopup(new maplibregl.Popup().setText("Destination"))
      .addTo(map);

    const bounds = new maplibregl.LngLatBounds();

    route.geometry.coordinates.forEach(point => bounds.extend(point));

    map.fitBounds(bounds, {
      padding: window.innerWidth < 500 ? 45 : 90,
      duration: 1200
    });

    const km = (route.distance / 1000).toFixed(1);
    const minutes = Math.round(route.duration / 60);

    setStatus(
      "Route found: " + km + " km. Estimated driving time: " +
      minutes + " minutes."
    );

    startNavigation();

  } catch (error) {
    setStatus(error.message || "Unable to calculate route.");
  }
}

// Switch normal map and satellite imagery
function toggleSatellite() {
  if (!mapReady) {
    setStatus("Map is loading. Please wait.");
    return;
  }

  satelliteMode = !satelliteMode;

  map.setLayoutProperty(
    "satelliteLayer",
    "visibility",
    satelliteMode ? "visible" : "none"
  );

  // Satellite layer is inserted above the normal map but below
  // the traffic and route layers. Route and traffic stay visible.
  setStatus(
    satelliteMode
      ? "🛰️ Satellite view enabled."
      : "🗺️ Normal map view enabled."
  );
}

// Toggle traffic
function toggleTraffic() {
  if (!mapReady || !map.getLayer("trafficLayer")) {
    setStatus("Map is loading. Please wait.");
    return;
  }

  trafficVisible = !trafficVisible;

  map.setLayoutProperty(
    "trafficLayer",
    "visibility",
    trafficVisible ? "visible" : "none"
  );

  setStatus(
    trafficVisible
      ? "Traffic overlay enabled. A valid TomTom key is required for real traffic."
      : "Traffic overlay disabled."
  );
}

// 2D and 3D
function toggle3D() {
  is3D = !is3D;

  map.easeTo({
    pitch: is3D ? 55 : 0,
    duration: 1000
  });
}

// Full screen
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}

// Navigation view
function toggleNavigationPanel() {
  document.body.classList.toggle("nav-mode");
}

// Stop navigation tracking
function stopNavigation() {
  navigationActive = false;

  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  document.body.classList.remove("nav-mode");

  setStatus("Navigation stopped.");
}

// Keep the map centred on live GPS location
function startNavigation() {
  navigationActive = true;
  document.body.classList.add("nav-mode");

  if (!navigator.geolocation) {
    return;
  }

  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
  }

  watchId = navigator.geolocation.watchPosition(
    position => {
      currentPosition = [
        position.coords.longitude,
        position.coords.latitude
      ];

      showLocation(currentPosition);

      if (navigationActive) {
        map.easeTo({
          center: currentPosition,
          duration: 700
        });
      }
    },
    error => {
      console.warn("Live GPS update failed:", error.message);
    },
    {
      enableHighAccuracy: true,
      maximumAge: 3000,
      timeout: 15000
    }
  );
}

// Clear route and destination
function clearRoute() {
  if (mapReady && map.getSource("routeSource")) {
    map.getSource("routeSource").setData({
      type: "Feature",
      properties: {},
      geometry: {
        type: "LineString",
        coordinates: []
      }
    });
  }

  if (destinationMarker) {
    destinationMarker.remove();
    destinationMarker = null;
  }

  stopNavigation();

  document.getElementById("destination").value = "";

  setStatus("Route cleared. Enter a new destination.");
}
</script>

</body>
</html>
