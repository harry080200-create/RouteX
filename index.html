<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081323">
<title>RouteX — Explore More</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
:root {
  --blue:#0878ff;
  --cyan:#48d5ff;
  --dark:#081323;
}

* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--dark);
}

button,input { font:inherit; }
button { cursor:pointer; }

#map {
  position:absolute;
  inset:0;
}

/* ICONS */

.icon {
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex-shrink:0;
}

/* TOP SEARCH */

.top-area {
  position:absolute;
  z-index:10;
  top:calc(env(safe-area-inset-top) + 10px);
  left:12px;
  right:12px;
}

.searchbar {
  display:flex;
  align-items:center;
  gap:9px;
  min-height:72px;
  padding:9px;
  border:1px solid #ffffff20;
  border-radius:25px;
  color:white;
  background:rgba(8,21,39,.96);
  box-shadow:0 10px 35px #0004;
  backdrop-filter:blur(22px);
}

.brand {
  display:flex;
  align-items:center;
  gap:7px;
  padding-right:9px;
  border-right:1px solid #ffffff25;
}

.logo {
  display:grid;
  place-items:center;
  width:43px;
  height:43px;
  border-radius:15px;
  background:linear-gradient(140deg,#48dfff,#0878ff 60%,#8152ff);
}

.logo svg {
  width:32px;
  height:32px;
}

.brand-name {
  font-size:21px;
  font-weight:850;
  letter-spacing:-1px;
  white-space:nowrap;
}

.brand-name span { color:var(--cyan); }

.brand-sub {
  margin-top:3px;
  font-size:9px;
  letter-spacing:1.5px;
  color:#a4b5cb;
}

.searchbox {
  display:flex;
  align-items:center;
  gap:8px;
  flex:1;
  min-width:0;
}

.searchbox input {
  width:100%;
  min-width:0;
  outline:none;
  border:0;
  color:white;
  background:transparent;
  font-size:14px;
}

.searchbox input::placeholder { color:#b4c4d7; }

.icon-btn {
  display:grid;
  place-items:center;
  width:32px;
  height:38px;
  padding:0;
  border:0;
  color:white;
  background:transparent;
}

.profile {
  display:grid;
  place-items:center;
  width:43px;
  height:43px;
  flex-shrink:0;
  border:3px solid var(--blue);
  border-radius:50%;
  color:white;
  background:#132944;
}

/* QUICK TABS */

.chips {
  display:flex;
  gap:9px;
  margin-top:11px;
  overflow-x:auto;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar { display:none; }

.chip {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:45px;
  padding:0 15px;
  border:1px solid #ffffff24;
  border-radius:24px;
  color:#f3f7ff;
  background:rgba(8,21,39,.95);
  font-size:13px;
  font-weight:650;
  white-space:nowrap;
}

.chip.active {
  border:2px solid var(--blue);
  color:#56c5ff;
  background:#09294a;
}

/* RIGHT CONTROLS */

.map-actions {
  position:absolute;
  z-index:5;
  top:190px;
  right:13px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.round-action {
  display:grid;
  place-items:center;
  width:52px;
  height:52px;
  border:1px solid #ffffff22;
  border-radius:50%;
  color:white;
  background:rgba(8,21,39,.96);
  box-shadow:0 5px 20px #0004;
}

.round-action.active {
  color:#51caff;
  border-color:var(--blue);
}

/* AUTOCOMPLETE */

.suggestions {
  display:none;
  position:absolute;
  z-index:30;
  top:79px;
  left:0;
  right:0;
  max-height:38vh;
  overflow:auto;
  border:1px solid #ffffff20;
  border-radius:18px;
  background:#0b1a2d;
  box-shadow:0 15px 40px #0008;
}

.suggestions.show { display:block; }

.suggestion {
  display:flex;
  align-items:flex-start;
  gap:10px;
  width:100%;
  padding:13px;
  border:0;
  border-bottom:1px solid #ffffff12;
  color:white;
  text-align:left;
  background:transparent;
}

.suggestion .icon { color:var(--cyan); }

.suggestion strong {
  display:block;
  font-size:13px;
}

.suggestion small {
  display:block;
  margin-top:4px;
  color:#a7b8cf;
  font-size:11px;
  line-height:1.4;
}

/* STATUS */

.status {
  display:none;
  position:absolute;
  z-index:15;
  top:calc(env(safe-area-inset-top) + 145px);
  left:50%;
  transform:translateX(-50%);
  max-width:90%;
  padding:10px 15px;
  border:1px solid #ffffff20;
  border-radius:18px;
  color:white;
  background:#09182bf2;
  text-align:center;
  font-size:12px;
  line-height:1.5;
}

.status.show { display:block; }

/* LOCATION MARKER */

.location-dot {
  width:23px;
  height:23px;
  border:3px solid white;
  border-radius:50%;
  background:#0878ff;
  box-shadow:0 0 0 7px #168bff45,0 0 20px #168bff;
}

/* ROUTE PLANNER */

.route-planner {
  position:absolute;
  z-index:8;
  left:12px;
  right:12px;
  bottom:calc(env(safe-area-inset-bottom) + 16px);
  padding:16px;
  border:1px solid #ffffff25;
  border-radius:23px;
  color:white;
  background:rgba(7,20,38,.96);
  box-shadow:0 12px 40px #0005;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.planner-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.planner-heading strong {
  font-size:15px;
}

.close-planner {
  display:grid;
  place-items:center;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  color:white;
  background:#ffffff12;
}

.field-row {
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:10px;
}

.field-symbol {
  width:10px;
  height:10px;
  margin-left:5px;
  flex-shrink:0;
  border:3px solid #43b9ff;
  border-radius:50%;
}

.field-symbol.destination {
  width:11px;
  height:11px;
  border:0;
  border-radius:3px;
  background:#ff5475;
  transform:rotate(45deg);
}

.field-wrap {
  position:relative;
  flex:1;
  min-width:0;
}

.field-wrap input {
  width:100%;
  height:44px;
  padding:0 12px;
  outline:none;
  border:1px solid #ffffff18;
  border-radius:12px;
  color:white;
  background:#ffffff09;
  font-size:13px;
}

.field-wrap input::placeholder { color:#a7b8cf; }

.small-gps {
  display:grid;
  place-items:center;
  width:39px;
  height:39px;
  border:1px solid #ffffff20;
  border-radius:12px;
  color:#56caff;
  background:#ffffff08;
}

.planner-buttons {
  display:flex;
  gap:9px;
  margin-top:12px;
}

.find-button,
.start-button {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:47px;
  padding:0 15px;
  border:0;
  border-radius:14px;
  color:white;
  background:linear-gradient(135deg,#168cff,#0759df);
  font-size:13px;
  font-weight:800;
}

.find-button { flex:1; }

.start-button { display:none; }

.start-button.show { display:flex; }

.route-summary {
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:13px;
  padding:13px;
  border:1px solid #ffffff15;
  border-radius:15px;
  background:#ffffff08;
}

.route-summary.show { display:flex; }

.distance {
  font-size:24px;
  font-weight:850;
}

.duration {
  margin-top:4px;
  color:#b5c8df;
  font-size:12px;
}

.destination-caption {
  margin-top:5px;
  color:#59c6ff;
  font-size:11px;
  line-height:1.5;
}

/* NAVIGATION */

.navigation-panel {
  display:none;
  position:absolute;
  z-index:20;
  top:calc(env(safe-area-inset-top) + 12px);
  left:12px;
  right:12px;
  padding:17px;
  border:1px solid #ffffff24;
  border-radius:22px;
  color:white;
  background:rgba(7,20,38,.97);
  box-shadow:0 10px 30px #0004;
}

.navigation-panel.show { display:block; }

.nav-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.nav-title {
  font-size:17px;
  font-weight:850;
}

.nav-exit {
  padding:10px 13px;
  border:0;
  border-radius:12px;
  color:white;
  background:#173553;
}

.nav-detail {
  margin-top:11px;
  color:#d1e3f7;
  font-size:13px;
  line-height:1.6;
}

.nav-distance {
  margin-top:10px;
  color:#52c5ff;
  font-size:22px;
  font-weight:800;
}

/* HIDE PLANNER WHILE NAVIGATING */

body.navigation-mode .top-area,
body.navigation-mode .map-actions,
body.navigation-mode .route-planner {
  display:none !important;
}

@media(min-width:700px) {
  .top-area {
    top:20px;
    left:20px;
    right:auto;
    width:550px;
  }

  .map-actions {
    top:200px;
    right:22px;
  }

  .route-planner {
    left:auto;
    right:25px;
    bottom:25px;
    width:390px;
  }

  .navigation-panel {
    top:25px;
    left:25px;
    right:auto;
    width:390px;
  }
}

@media(max-width:390px) {
  .brand-name { font-size:18px; }
  .brand-sub { font-size:8px; }
  .brand { gap:6px; padding-right:7px; }
  .logo { width:38px; height:38px; }
  .logo svg { width:28px; height:28px; }
  .searchbar { gap:6px; padding:8px; }
  .profile { width:38px; height:38px; }
  .chip { padding:0 12px; }
  .route-planner { padding:13px; }
}
</style>
</head>

<body>

<!-- INLINE SVG ICONS -->
<svg xmlns="http://www.w3.org/2000/svg"
style="position:absolute;width:0;height:0;overflow:hidden">

<symbol id="logoIcon" viewBox="0 0 48 48">
  <path d="M24 4C13 4 5 12 5 23c0 8 5 13 10 19l9 5 9-10c5-6 10-11 10-19C43 12 35 4 24 4Z"
  stroke="white" stroke-width="3.5" fill="none"/>
  <circle cx="24" cy="18" r="6" stroke="white" stroke-width="3" fill="none"/>
  <path d="M16 34c0-5 3-8 8-8s8 3 8 8"
  stroke="white" stroke-width="3" fill="none"/>
</symbol>

<symbol id="search" viewBox="0 0 24 24">
  <circle cx="10.5" cy="10.5" r="6.5"/>
  <path d="m16 16 4.5 4.5"/>
</symbol>

<symbol id="mic" viewBox="0 0 24 24">
  <rect x="9" y="3" width="6" height="12" rx="3"/>
  <path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/>
</symbol>

<symbol id="compass" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="9"/>
  <path d="m16 8-2.5 5.5L8 16l2.5-5.5L16 8Z"/>
</symbol>

<symbol id="bookmark" viewBox="0 0 24 24">
  <path d="M6 4h12v17l-6-4-6 4Z"/>
</symbol>

<symbol id="food" viewBox="0 0 24 24">
  <path d="M7 3v7M4 3v4a3 3 0 0 0 6 0V3M7 10v11M16 3v18M16 3c4 2 4 7 0 9"/>
</symbol>

<symbol id="layers" viewBox="0 0 24 24">
  <path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/>
</symbol>

<symbol id="gps" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="8"/>
  <circle cx="12" cy="12" r="3"/>
  <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
</symbol>

<symbol id="route" viewBox="0 0 24 24">
  <circle cx="6" cy="18" r="3"/>
  <circle cx="18" cy="6" r="3"/>
  <path d="M9 18h3a3 3 0 0 0 3-3V9"/>
</symbol>

<symbol id="arrow" viewBox="0 0 24 24">
  <path d="M5 12h14M12 5l7 7-7 7"/>
</symbol>

<symbol id="close" viewBox="0 0 24 24">
  <path d="m18 6-12 12M6 6l12 12"/>
</symbol>

<symbol id="profile" viewBox="0 0 24 24">
  <circle cx="12" cy="8" r="4"/>
  <path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/>
</symbol>

</svg>

<div id="map"></div>

<header class="top-area">
  <div class="searchbar">

    <div class="brand">
      <div class="logo">
        <svg class="icon"><use href="#logoIcon"/></svg>
      </div>
      <div>
        <div class="brand-name">Route<span>X</span></div>
        <div class="brand-sub">Explore More</div>
      </div>
    </div>

    <div class="searchbox">
      <svg class="icon"><use href="#search"/></svg>
      <input id="searchInput" placeholder="Search places" autocomplete="off">
    </div>

    <button class="icon-btn" onclick="voiceSearch()" aria-label="Voice search">
      <svg class="icon"><use href="#mic"/></svg>
    </button>

    <button class="profile" onclick="showStatus('Welcome to RouteX')" aria-label="Profile">
      <svg class="icon"><use href="#profile"/></svg>
    </button>
  </div>

  <div class="chips">
    <button class="chip active" id="exploreChip" onclick="setTab('explore')">
      <svg class="icon"><use href="#compass"/></svg>Explore
    </button>

    <button class="chip" id="savedChip" onclick="setTab('saved')">
      <svg class="icon"><use href="#bookmark"/></svg>Saved
    </button>

    <button class="chip" id="foodChip" onclick="setTab('food')">
      <svg class="icon"><use href="#food"/></svg>Food
    </button>
  </div>

  <div id="searchSuggestions" class="suggestions"></div>
</header>

<div class="map-actions">

  <button class="round-action active" id="layersBtn"
  onclick="toggleMapType()" aria-label="Map type">
    <svg class="icon"><use href="#layers"/></svg>
  </button>

  <button class="round-action" onclick="useMyLocation()" aria-label="My location">
    <svg class="icon"><use href="#gps"/></svg>
  </button>

  <button class="round-action" onclick="openPlanner()" aria-label="Plan route">
    <svg class="icon"><use href="#route"/></svg>
  </button>

</div>

<div class="status" id="status" aria-live="polite"></div>

<!-- START AND DESTINATION PANEL -->

<section class="route-planner" id="routePlanner">

  <div class="planner-heading">
    <strong>Plan your journey</strong>
    <button class="close-planner" onclick="closePlanner()" aria-label="Close">
      <svg class="icon"><use href="#close"/></svg>
    </button>
  </div>

  <div class="field-row">
    <span class="field-symbol"></span>

    <div class="field-wrap">
      <input id="startInput" placeholder="Starting point" autocomplete="off">
    </div>

    <button class="small-gps" onclick="useGPSAsStart()" aria-label="Use current location">
      <svg class="icon"><use href="#gps"/></svg>
    </button>
  </div>

  <div class="field-row">
    <span class="field-symbol destination"></span>

    <div class="field-wrap">
      <input id="destinationInput" placeholder="Where do you want to go?" autocomplete="off">
    </div>
  </div>

  <div class="planner-buttons">
    <button class="find-button" onclick="calculateRoute()">
      <svg class="icon"><use href="#search"/></svg>
      Find Route
    </button>

    <button class="start-button" id="startButton" onclick="startNavigation()">
      <svg class="icon"><use href="#arrow"/></svg>
      Start
    </button>
  </div>

  <div class="route-summary" id="routeSummary">
    <div>
      <div class="distance" id="distanceText">-- km</div>
      <div class="duration" id="durationText">-- min</div>
      <div class="destination-caption" id="destinationCaption"></div>
    </div>

    <button class="start-button show" onclick="startNavigation()">
      <svg class="icon"><use href="#arrow"/></svg>
      Start Navigation
    </button>
  </div>

</section>

<!-- NAVIGATION MODE -->

<div class="navigation-panel" id="navigationPanel">
  <div class="nav-top">
    <div class="nav-title">RouteX Navigation</div>
    <button class="nav-exit" onclick="stopNavigation()">Exit</button>
  </div>

  <div class="nav-detail" id="navDetail">
    Follow the route shown on the map.
  </div>

  <div class="nav-distance" id="navDistance"></div>
</div>

<script>
let map;
let currentPosition=null;
let currentMarker=null;
let destinationMarker=null;
let satelliteOn=true;
let navigationOn=false;
let routeWatchId=null;
let routeCoordinates=[];
let currentRoute=null;
let destinationLocation=null;
let searchTimer=null;
let suggestionTarget="main";
let searchRequest=0;

const $=id=>document.getElementById(id);

/* STATUS */

function showStatus(message) {
  const el=$("status");
  el.textContent=message;
  el.classList.add("show");

  clearTimeout(showStatus.timer);

  showStatus.timer=setTimeout(()=>{
    el.classList.remove("show");
  },3500);
}

/* MAP */

map=new maplibregl.Map({
  container:"map",
  style:"https://tiles.openfreemap.org/styles/liberty",
  center:[76.53,30.97],
  zoom:11,
  attributionControl:false
});

map.addControl(
  new maplibregl.NavigationControl({showCompass:true}),
  "bottom-right"
);

map.on("load",()=>{
  map.addSource("satelliteSource",{
    type:"raster",
    tiles:[
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
    ],
    tileSize:256,
    attribution:"Imagery © Esri"
  });

  map.addLayer({
    id:"satelliteLayer",
    type:"raster",
    source:"satelliteSource",
    layout:{visibility:"visible"}
  });

  map.addSource("routeSource",{
    type:"geojson",
    data:{
      type:"FeatureCollection",
      features:[]
    }
  });

  map.addLayer({
    id:"routeGlow",
    type:"line",
    source:"routeSource",
    layout:{
      "line-cap":"round",
      "line-join":"round"
    },
    paint:{
      "line-color":"#0878ff",
      "line-width":12,
      "line-opacity":0.3,
      "line-blur":3
    }
  });

  map.addLayer({
    id:"routeLine",
    type:"line",
    source:"routeSource",
    layout:{
      "line-cap":"round",
      "line-join":"round"
    },
    paint:{
      "line-color":"#168bff",
      "line-width":5
    }
  });

  showStatus("RouteX ready. Enter your starting point and destination.");
});

/* SEARCH SUGGESTIONS FOR MAIN SEARCH + ROUTE FIELDS */

function setupAutocomplete(inputId,target) {
  const input=$(inputId);

  input.addEventListener("input",()=>{
    clearTimeout(searchTimer);

    const query=input.value.trim();

    if(query.length<2) {
      $("searchSuggestions").classList.remove("show");
      return;
    }

    suggestionTarget=target;

    searchTimer=setTimeout(()=>{
      searchPlaces(query,target);
    },350);
  });

  input.addEventListener("focus",()=>{
    suggestionTarget=target;
  });
}

setupAutocomplete("searchInput","main");
setupAutocomplete("startInput","start");
setupAutocomplete("destinationInput","destination");

async function searchPlaces(query,target) {
  const box=$("searchSuggestions");
  const requestId=++searchRequest;

  box.innerHTML=
    '<div class="suggestion">Searching locations...</div>';

  box.classList.add("show");

  try {
    const response=await fetch(
      "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&q="+
      encodeURIComponent(query),
      {headers:{"Accept-Language":"en"}}
    );

    if(!response.ok) throw new Error("Search unavailable");

    const results=await response.json();

    if(requestId!==searchRequest) return;

    box.innerHTML="";

    if(!results.length) {
      box.innerHTML=
        '<div class="suggestion">No places found. Try another search.</div>';
      return;
    }

    results.forEach(place=>{
      const button=document.createElement("button");
      button.className="suggestion";
      button.type="button";

      button.innerHTML=
        '<svg class="icon"><use href="#search"></use></svg>';

      const text=document.createElement("div");
      const title=document.createElement("strong");
      const detail=document.createElement("small");

      title.textContent=
        place.name||place.display_name.split(",")[0];

      detail.textContent=place.display_name;

      text.append(title,detail);
      button.appendChild(text);

      button.addEventListener("click",()=>{
        const location={
          name:place.name||place.display_name.split(",")[0],
          display:place.display_name,
          coords:[Number(place.lon),Number(place.lat)]
        };

        if(target==="main") {
          $("searchInput").value=location.name;
          destinationLocation=location;
          $("destinationInput").value=location.name;

          map.flyTo({
            center:location.coords,
            zoom:14,
            duration:900
          });

          placeDestinationMarker(location.coords);
          openPlanner();

        } else if(target==="start") {
          $("startInput").value=location.name;
        } else {
          $("destinationInput").value=location.name;
          destinationLocation=location;
          placeDestinationMarker(location.coords);
        }

        box.classList.remove("show");
      });

      box.appendChild(button);
    });

  } catch(error) {
    if(requestId!==searchRequest) return;

    box.innerHTML=
      '<div class="suggestion">Search failed. Check your internet connection.</div>';
  }
}

document.addEventListener("click",event=>{
  if(!event.target.closest(".top-area")&&
     !event.target.closest(".field-wrap")) {
    $("searchSuggestions").classList.remove("show");
  }
});

/* GEOCODING */

async function geocode(query) {
  const response=await fetch(
    "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+
    encodeURIComponent(query),
    {headers:{"Accept-Language":"en"}}
  );

  if(!response.ok) {
    throw new Error("Could not search for "+query);
  }

  const data=await response.json();

  if(!data.length) {
    throw new Error("Place not found: "+query);
  }

  return {
    name:data[0].name||data[0].display_name.split(",")[0],
    display:data[0].display_name,
    coords:[Number(data[0].lon),Number(data[0].lat)]
  };
}

/* DESTINATION MARKER */

function placeDestinationMarker(coords) {
  if(destinationMarker) destinationMarker.remove();

  destinationMarker=new maplibregl.Marker({color:"#ff4567"})
    .setLngLat(coords)
    .addTo(map);
}

/* CURRENT LOCATION */

function useMyLocation() {
  if(!navigator.geolocation) {
    showStatus("GPS is not available in this browser.");
    return;
  }

  showStatus("Finding your current location...");

  navigator.geolocation.getCurrentPosition(position=>{
    currentPosition=[
      position.coords.longitude,
      position.coords.latitude
    ];

    if(currentMarker) currentMarker.remove();

    const el=document.createElement("div");
    el.className="location-dot";

    currentMarker=new maplibregl.Marker({element:el})
      .setLngLat(currentPosition)
      .addTo(map);

    map.flyTo({
      center:currentPosition,
      zoom:15,
      duration:1000
    });

    $("startInput").value="My Location";

    showStatus("Current location selected as starting point.");

  },()=>{
    showStatus("Allow location permission in your browser settings.");
  },{
    enableHighAccuracy:true,
    timeout:20000,
    maximumAge:5000
  });
}

function useGPSAsStart() {
  useMyLocation();
}

/* ROUTE CALCULATION */

async function calculateRoute() {
  const startText=$("startInput").value.trim();
  const destinationText=$("destinationInput").value.trim();

  if(!startText) {
    showStatus("Enter a starting point or tap the GPS button.");
    $("startInput").focus();
    return;
  }

  if(!destinationText) {
    showStatus("Enter your destination first.");
    $("destinationInput").focus();
    return;
  }

  try {
    showStatus("Finding the best route...");

    let start;

    if(startText.toLowerCase()==="my location") {
      if(!currentPosition) {
        await new Promise((resolve,reject)=>{
          navigator.geolocation.getCurrentPosition(position=>{
            currentPosition=[
              position.coords.longitude,
              position.coords.latitude
            ];
            resolve();
          },reject,{
            enableHighAccuracy:true,
            timeout:15000
          });
        });
      }

      start={
        name:"My Location",
        coords:currentPosition
      };

    } else {
      start=await geocode(startText);
    }

    const destination=await geocode(destinationText);

    const url=
      "https://router.project-osrm.org/route/v1/driving/"+
      start.coords.join(",")+";"+
      destination.coords.join(",")+
      "?overview=full&geometries=geojson&steps=true";

    const response=await fetch(url);

    if(!response.ok) {
      throw new Error("Route service unavailable. Try again.");
    }

    const data=await response.json();

    if(data.code!=="Ok"||!data.routes||!data.routes.length) {
      throw new Error("No driving route found between these places.");
    }

    const route=data.routes[0];

    routeCoordinates=route.geometry.coordinates;

    currentRoute={
      start,
      destination,
      route
    };

    destinationLocation=destination;

    map.getSource("routeSource").setData({
      type:"Feature",
      properties:{},
      geometry:route.geometry
    });

    placeDestinationMarker(destination.coords);

    const bounds=new maplibregl.LngLatBounds();

    routeCoordinates.forEach(coord=>bounds.extend(coord));

    map.fitBounds(bounds,{
      padding:{
        top:180,
        bottom:300,
        left:35,
        right:35
      },
      maxZoom:15,
      duration:1000
    });

    const km=(route.distance/1000).toFixed(1);
    const mins=Math.max(1,Math.round(route.duration/60));

    $("distanceText").textContent=km+" km";

    $("durationText").textContent=
      mins>=60
      ?Math.floor(mins/60)+" hr "+(mins%60)+" min"
      :mins+" min";

    $("destinationCaption").textContent=
      start.name+" → "+destination.name;

    $("routeSummary").classList.add("show");
    $("startButton").classList.add("show");

    $("navDetail").textContent=
      "Heading to "+destination.name+
      ". Follow the highlighted route.";

    $("navDistance").textContent=km+" km · "+mins+" min";

    showStatus("Route ready. Tap Start Navigation.");

  } catch(error) {
    showStatus(error.message||"Could not calculate route.");
  }
}

/* NAVIGATION MODE */

function startNavigation() {
  if(!currentRoute||!routeCoordinates.length) {
    showStatus("Find a route first.");
    return;
  }

  navigationOn=true;

  document.body.classList.add("navigation-mode");
  $("navigationPanel").classList.add("show");

  if(currentPosition) {
    map.easeTo({
      center:currentPosition,
      zoom:16,
      duration:800
    });
  }

  $("navDetail").textContent=
    "Navigate to "+currentRoute.destination.name+
    ". Follow the blue route on the map.";

  showStatus("Navigation started.");

  if(navigator.geolocation) {
    if(routeWatchId!==null) {
      navigator.geolocation.clearWatch(routeWatchId);
    }

    routeWatchId=navigator.geolocation.watchPosition(position=>{
      currentPosition=[
        position.coords.longitude,
        position.coords.latitude
      ];

      if(!currentMarker) {
        const el=document.createElement("div");
        el.className="location-dot";

        currentMarker=new maplibregl.Marker({element:el})
          .setLngLat(currentPosition)
          .addTo(map);
      } else {
        currentMarker.setLngLat(currentPosition);
      }

      if(navigationOn) {
        map.easeTo({
          center:currentPosition,
          duration:700
        });
      }

    },()=>{},{
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:15000
    });
  }
}

function stopNavigation() {
  navigationOn=false;

  document.body.classList.remove("navigation-mode");
  $("navigationPanel").classList.remove("show");

  if(routeWatchId!==null&&navigator.geolocation) {
    navigator.geolocation.clearWatch(routeWatchId);
    routeWatchId=null;
  }

  showStatus("Navigation closed.");
}

/* MAP TYPE */

function toggleMapType() {
  if(!map.getLayer("satelliteLayer")) return;

  satelliteOn=!satelliteOn;

  map.setLayoutProperty(
    "satelliteLayer",
    "visibility",
    satelliteOn?"visible":"none"
  );

  $("layersBtn").classList.toggle("active",satelliteOn);

  showStatus(
    satelliteOn?"Satellite view enabled.":"Default map enabled."
  );
}

/* OPEN/CLOSE PLANNER */

function openPlanner() {
  $("routePlanner").style.display="block";
}

function closePlanner() {
  if(currentRoute) {
    $("routePlanner").style.display="none";
  } else {
    showStatus("Enter a starting point and destination to plan your route.");
  }
}

/* QUICK TABS */

function setTab(tab) {
  ["explore","saved","food"].forEach(name=>{
    $(name+"Chip").classList.toggle("active",name===tab);
  });

  if(tab==="food") {
    $("searchInput").value="Restaurants";
    $("searchInput").dispatchEvent(new Event("input"));
    $("searchInput").focus();
    showStatus("Choose a place from the search suggestions.");
  } else if(tab==="saved") {
    showStatus("Saved places feature can be added in a future update.");
  } else {
    showStatus("Search for a place to explore.");
  }
}

/* VOICE SEARCH */

function voiceSearch() {
  const Recognition=
    window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!Recognition) {
    showStatus("Voice search is not supported in this browser.");
    return;
  }

  const recognition=new Recognition();
  recognition.lang="en-IN";

  recognition.onresult=event=>{
    const query=event.results[0][0].transcript;

    $("searchInput").value=query;
    $("searchInput").dispatchEvent(new Event("input"));
  };

  recognition.onerror=()=>{
    showStatus("Voice search could not start.");
  };

  recognition.start();
}

/* ESCAPE KEY */

document.addEventListener("keydown",event=>{
  if(event.key==="Escape") {
    $("searchSuggestions").classList.remove("show");

    if(navigationOn) stopNavigation();
  }

  if(event.key==="Enter") {
    if(document.activeElement===$("startInput")||
       document.activeElement===$("destinationInput")) {
      calculateRoute();
    }
  }
});
</script>

</body>
</html>
