<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081323">
<title>RouteX — Explore More</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
:root {
  --blue:#0878ff;
  --cyan:#48d5ff;
  --dark:#081323;
  --muted:#a7b8cf;
}

* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--dark);
}

button,input { font:inherit; }
button { cursor:pointer; }

#map {
  position:absolute;
  inset:0;
  background:#142d3a;
}

svg.icon {
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* TOP SEARCH BAR */

.top-area {
  position:absolute;
  z-index:5;
  top:calc(env(safe-area-inset-top) + 10px);
  left:12px;
  right:12px;
}

.searchbar {
  display:flex;
  align-items:center;
  gap:10px;
  min-height:72px;
  padding:10px;
  border-radius:25px;
  border:1px solid #ffffff20;
  background:rgba(8,21,39,.94);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  color:white;
  box-shadow:0 10px 35px #0004;
}

.brand {
  display:flex;
  align-items:center;
  gap:8px;
  padding-right:10px;
  border-right:1px solid #ffffff24;
  flex-shrink:0;
}

.logo {
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:15px;
  color:white;
  background:linear-gradient(140deg,#43dfff,#0878ff 58%,#8252ff);
  box-shadow:0 0 22px #168bff40;
}

.logo svg {
  width:32px;
  height:32px;
}

.brand-name {
  font-size:21px;
  font-weight:850;
  letter-spacing:-1px;
  white-space:nowrap;
}

.brand-name span { color:var(--cyan); }

.brand-sub {
  margin-top:3px;
  font-size:9px;
  letter-spacing:1.6px;
  color:#9eafc5;
}

.searchbox {
  display:flex;
  align-items:center;
  gap:9px;
  flex:1;
  min-width:0;
}

.searchbox svg { flex-shrink:0; }

#searchInput {
  width:100%;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:15px;
}

#searchInput::placeholder { color:#aabbd0; }

.icon-btn {
  width:34px;
  height:38px;
  border:0;
  display:grid;
  place-items:center;
  color:white;
  background:transparent;
  flex-shrink:0;
}

.profile {
  width:45px;
  height:45px;
  display:grid;
  place-items:center;
  border:3px solid var(--blue);
  border-radius:50%;
  color:white;
  background:#122942;
  flex-shrink:0;
}

/* SEARCH SUGGESTIONS */

.suggestions {
  display:none;
  position:absolute;
  z-index:20;
  top:80px;
  left:0;
  right:0;
  max-height:45vh;
  overflow:auto;
  border:1px solid #ffffff20;
  border-radius:18px;
  background:#0b1a2d;
  box-shadow:0 15px 40px #0009;
}

.suggestions.show { display:block; }

.suggestion {
  display:flex;
  align-items:flex-start;
  gap:12px;
  width:100%;
  padding:14px;
  text-align:left;
  border:0;
  border-bottom:1px solid #ffffff12;
  color:white;
  background:transparent;
}

.suggestion svg {
  flex-shrink:0;
  color:var(--cyan);
}

.suggestion strong {
  display:block;
  font-size:13px;
}

.suggestion small {
  display:block;
  margin-top:4px;
  font-size:11px;
  line-height:1.5;
  color:#a7b8cf;
}

/* TOP QUICK BUTTONS */

.chips {
  display:flex;
  gap:9px;
  margin-top:12px;
  overflow-x:auto;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar { display:none; }

.chip {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  min-height:44px;
  padding:0 16px;
  border:1px solid #ffffff25;
  border-radius:24px;
  color:#f1f7ff;
  background:rgba(8,21,39,.92);
  backdrop-filter:blur(18px);
  white-space:nowrap;
  font-size:13px;
  font-weight:650;
}

.chip.active {
  border:2px solid #168bff;
  color:#53bdff;
  background:#09294a;
}

/* RIGHT SIDE MAP CONTROLS */

.map-actions {
  position:absolute;
  z-index:4;
  top:190px;
  right:13px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.round-action {
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  border:1px solid #ffffff20;
  border-radius:50%;
  color:white;
  background:rgba(8,21,39,.94);
  backdrop-filter:blur(18px);
  box-shadow:0 5px 20px #0004;
}

.round-action.active {
  color:#4acbff;
  border-color:#168bff;
}

/* STATUS MESSAGE */

.status-pill {
  display:none;
  position:absolute;
  z-index:12;
  top:calc(env(safe-area-inset-top) + 145px);
  left:50%;
  transform:translateX(-50%);
  max-width:90%;
  padding:10px 15px;
  border:1px solid #ffffff20;
  border-radius:20px;
  background:#09182beF;
  color:white;
  text-align:center;
  font-size:12px;
  line-height:1.5;
  backdrop-filter:blur(18px);
}

.status-pill.show { display:block; }

/* LOCATION MARKER */

.location-dot {
  width:23px;
  height:23px;
  border:3px solid white;
  border-radius:50%;
  background:#0878ff;
  box-shadow:0 0 0 7px #168bff40,0 0 20px #168bff;
}

/* ROUTE CARD — REPLACES THE WHITE BOX */

.route-card {
  display:none;
  position:absolute;
  z-index:10;
  left:12px;
  right:12px;
  bottom:calc(env(safe-area-inset-bottom) + 17px);
  align-items:center;
  gap:12px;
  padding:15px;
  border:1px solid #ffffff22;
  border-radius:24px;
  background:rgba(7,20,38,.96);
  color:white;
  box-shadow:0 12px 40px #0005;
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.route-card.show { display:flex; }

.route-metrics {
  flex:1;
  min-width:0;
}

.route-distance {
  font-size:25px;
  font-weight:850;
  letter-spacing:-.7px;
}

.route-time {
  margin-top:5px;
  color:#b4c8df;
  font-size:12px;
}

.route-caption {
  margin-top:5px;
  color:#6ccaff;
  font-size:10px;
}

.start-button {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:49px;
  padding:0 15px;
  border:0;
  border-radius:15px;
  color:white;
  background:linear-gradient(135deg,#168cff,#0759df);
  box-shadow:0 5px 20px #0878ff35;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.start-button svg {
  width:19px;
  height:19px;
}

/* FULL SCREEN NAVIGATION MODE */

.navigation-panel {
  display:none;
  position:absolute;
  z-index:15;
  top:calc(env(safe-area-inset-top) + 12px);
  left:12px;
  right:12px;
  padding:18px;
  border:1px solid #ffffff25;
  border-radius:23px;
  color:white;
  background:rgba(7,20,38,.95);
  backdrop-filter:blur(25px);
}

.navigation-panel.show { display:block; }

.nav-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.nav-title {
  font-size:17px;
  font-weight:800;
}

.nav-direction {
  margin-top:12px;
  color:#d2e4fa;
  font-size:13px;
  line-height:1.7;
}

.nav-exit {
  padding:10px 13px;
  border:0;
  border-radius:12px;
  background:#173553;
  color:white;
  font-size:12px;
}

/* RESPONSIVE */

@media(min-width:700px) {
  .top-area {
    top:20px;
    left:20px;
    right:auto;
    width:560px;
  }

  .map-actions {
    top:200px;
    right:22px;
  }

  .route-card {
    left:auto;
    right:25px;
    bottom:25px;
    width:400px;
  }

  .navigation-panel {
    left:25px;
    right:auto;
    top:25px;
    width:380px;
  }
}

@media(max-width:390px) {
  .brand-name { font-size:18px; }
  .brand-sub { font-size:8px; }
  .brand { gap:6px; padding-right:7px; }
  .logo { width:38px; height:38px; }
  .logo svg { width:28px; height:28px; }
  .searchbar { gap:7px; padding:8px; }
  .profile { width:39px; height:39px; }
  .chip { padding:0 13px; }
  .route-card { gap:8px; padding:12px; }
  .route-distance { font-size:22px; }
  .start-button { padding:0 11px; font-size:11px; }
}

/* Hide all old white panel and bottom navigation elements */
.bottom-sheet,
.bottom-nav,
.places-card,
.place-header,
.sheet-handle {
  display:none !important;
}

body.navigation-mode .top-area,
body.navigation-mode .map-actions,
body.navigation-mode .route-card {
  display:none !important;
}
</style>
</head>

<body>

<!-- SVG ICON LIBRARY -->
<svg xmlns="http://www.w3.org/2000/svg"
style="position:absolute;width:0;height:0;overflow:hidden">

<symbol id="logoIcon" viewBox="0 0 48 48">
  <path d="M24 4C13 4 5 12 5 23c0 8 5 13 10 19l9 5 9-10c5-6 10-11 10-19C43 12 35 4 24 4Z"
  stroke="white" stroke-width="3.5" fill="none"/>
  <circle cx="24" cy="18" r="6" stroke="white" stroke-width="3" fill="none"/>
  <path d="M16 34c0-5 3-8 8-8s8 3 8 8"
  stroke="white" stroke-width="3" fill="none"/>
</symbol>

<symbol id="search" viewBox="0 0 24 24">
  <circle cx="10.5" cy="10.5" r="6.5"/>
  <path d="m16 16 4.5 4.5"/>
</symbol>

<symbol id="mic" viewBox="0 0 24 24">
  <rect x="9" y="3" width="6" height="12" rx="3"/>
  <path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/>
</symbol>

<symbol id="compass" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="9"/>
  <path d="m16 8-2.5 5.5L8 16l2.5-5.5L16 8Z"/>
</symbol>

<symbol id="bookmark" viewBox="0 0 24 24">
  <path d="M6 4h12v17l-6-4-6 4Z"/>
</symbol>

<symbol id="food" viewBox="0 0 24 24">
  <path d="M7 3v7M4 3v4a3 3 0 0 0 6 0V3M7 10v11M16 3v18M16 3c4 2 4 7 0 9"/>
</symbol>

<symbol id="layers" viewBox="0 0 24 24">
  <path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/>
</symbol>

<symbol id="gps" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="8"/>
  <circle cx="12" cy="12" r="3"/>
  <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
</symbol>

<symbol id="route" viewBox="0 0 24 24">
  <circle cx="6" cy="18" r="3"/>
  <circle cx="18" cy="6" r="3"/>
  <path d="M9 18h3a3 3 0 0 0 3-3V9"/>
</symbol>

<symbol id="arrow" viewBox="0 0 24 24">
  <path d="M5 12h14M12 5l7 7-7 7"/>
</symbol>

<symbol id="close" viewBox="0 0 24 24">
  <path d="m18 6-12 12M6 6l12 12"/>
</symbol>

<symbol id="profile" viewBox="0 0 24 24">
  <circle cx="12" cy="8" r="4"/>
  <path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/>
</symbol>

</svg>

<div id="map"></div>

<header class="top-area">
  <div class="searchbar">

    <div class="brand">
      <div class="logo">
        <svg class="icon"><use href="#logoIcon"/></svg>
      </div>

      <div>
        <div class="brand-name">Route<span>X</span></div>
        <div class="brand-sub">Explore More</div>
      </div>
    </div>

    <div class="searchbox">
      <svg class="icon"><use href="#search"/></svg>
      <input id="searchInput" placeholder="Search places" autocomplete="off">
      <div id="suggestions" class="suggestions"></div>
    </div>

    <button class="icon-btn" onclick="voiceSearch()" aria-label="Voice search">
      <svg class="icon"><use href="#mic"/></svg>
    </button>

    <button class="profile" onclick="showStatus('Welcome to RouteX')" aria-label="Profile">
      <svg class="icon"><use href="#profile"/></svg>
    </button>

  </div>

  <div class="chips">
    <button class="chip active" id="exploreChip" onclick="setTab('explore')">
      <svg class="icon"><use href="#compass"/></svg>Explore
    </button>

    <button class="chip" id="savedChip" onclick="setTab('saved')">
      <svg class="icon"><use href="#bookmark"/></svg>Saved
    </button>

    <button class="chip" id="foodChip" onclick="setTab('food')">
      <svg class="icon"><use href="#food"/></svg>Food
    </button>
  </div>
</header>

<div class="map-actions">

  <button class="round-action active" id="layersBtn"
  onclick="toggleMapType()" aria-label="Toggle satellite">
    <svg class="icon"><use href="#layers"/></svg>
  </button>

  <button class="round-action" onclick="useMyLocation()" aria-label="My location">
    <svg class="icon"><use href="#gps"/></svg>
  </button>

  <button class="round-action" onclick="toggleTraffic()" aria-label="Traffic">
    <svg class="icon"><use href="#route"/></svg>
  </button>

</div>

<div class="status-pill" id="statusPill" aria-live="polite"></div>

<!-- ONLY THE ROUTE CARD WILL APPEAR HERE AFTER A ROUTE IS FOUND -->

<div class="route-card" id="routeCard">

  <div class="route-metrics">
    <div class="route-distance" id="routeDistance">-- km</div>
    <div class="route-time" id="routeTime">Calculating time...</div>
    <div class="route-caption">Estimated driving time</div>
  </div>

  <button class="start-button" onclick="startNavigation()">
    <svg class="icon"><use href="#arrow"/></svg>
    <span>Start Navigation</span>
  </button>

</div>

<div class="navigation-panel" id="navigationPanel">
  <div class="nav-top">
    <div class="nav-title">RouteX Navigation</div>
    <button class="nav-exit" onclick="stopNavigation()">Exit</button>
  </div>
  <div class="nav-direction" id="navDirection">
    Follow the blue route.
  </div>
</div>

<script>
let map;
let currentPosition=null;
let currentMarker=null;
let destinationMarker=null;
let satelliteOn=true;
let trafficOn=false;
let navigationOn=false;
let routeCoords=[];
let routeWatchId=null;
let lastRoute=null;
let searchTimer=null;
let requestCounter=0;

const $=id=>document.getElementById(id);

/* STATUS MESSAGE */

function showStatus(message) {
  const el=$("statusPill");
  el.textContent=message;
  el.classList.add("show");

  clearTimeout(showStatus.timer);
  showStatus.timer=setTimeout(()=>{
    el.classList.remove("show");
  },4000);
}

/* MAP INITIALIZATION */

map=new maplibregl.Map({
  container:"map",
  style:"https://tiles.openfreemap.org/styles/liberty",
  center:[76.53,30.97],
  zoom:11,
  attributionControl:false
});

map.addControl(
  new maplibregl.NavigationControl({showCompass:true}),
  "bottom-right"
);

map.on("load",()=>{
  map.addSource("satelliteSource",{
    type:"raster",
    tiles:[
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
    ],
    tileSize:256,
    attribution:"Imagery © Esri"
  });

  map.addLayer({
    id:"satelliteLayer",
    type:"raster",
    source:"satelliteSource",
    layout:{visibility:"visible"},
    paint:{"raster-opacity":1}
  });

  map.addSource("routeSource",{
    type:"geojson",
    data:{
      type:"Feature",
      properties:{},
      geometry:{
        type:"LineString",
        coordinates:[]
      }
    }
  });

  map.addLayer({
    id:"routeGlow",
    type:"line",
    source:"routeSource",
    layout:{
      "line-cap":"round",
      "line-join":"round"
    },
    paint:{
      "line-color":"#0878ff",
      "line-width":13,
      "line-opacity":0.35,
      "line-blur":4
    }
  });

  map.addLayer({
    id:"routeLine",
    type:"line",
    source:"routeSource",
    layout:{
      "line-cap":"round",
      "line-join":"round"
    },
    paint:{
      "line-color":"#0878ff",
      "line-width":5
    }
  });

  addTrafficLayer();

  showStatus("RouteX is ready. Search a place.");
});

/* OPTIONAL TRAFFIC OVERLAY */

function addTrafficLayer() {
  if(map.getSource("trafficSource")) return;

  map.addSource("trafficSource",{
    type:"raster",
    tiles:[
      "https://api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=YOUR_TOMTOM_API_KEY"
    ],
    tileSize:256
  });

  map.addLayer({
    id:"trafficLayer",
    type:"raster",
    source:"trafficSource",
    layout:{visibility:"none"},
    paint:{"raster-opacity":0.8}
  },"routeGlow");
}

/* PLACE AUTOCOMPLETE */

$("searchInput").addEventListener("input",()=>{
  clearTimeout(searchTimer);

  const query=$("searchInput").value.trim();
  const box=$("suggestions");

  if(query.length<2) {
    box.classList.remove("show");
    box.innerHTML="";
    return;
  }

  box.innerHTML=
    '<div class="suggestion">Searching locations...</div>';

  box.classList.add("show");

  searchTimer=setTimeout(()=>{
    searchLocations(query);
  },350);
});

async function searchLocations(query) {
  const box=$("suggestions");
  const id=++requestCounter;

  try {
    const response=await fetch(
      "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=7&q="+
      encodeURIComponent(query),
      {headers:{"Accept-Language":"en"}}
    );

    if(!response.ok) throw new Error("Search unavailable");

    const results=await response.json();

    if(id!==requestCounter) return;

    box.innerHTML="";

    if(!results.length) {
      box.innerHTML=
        '<div class="suggestion">No locations found. Try another search.</div>';
      return;
    }

    results.forEach(place=>{
      const button=document.createElement("button");
      button.className="suggestion";
      button.type="button";

      button.innerHTML=
        '<svg class="icon"><use href="#search"></use></svg>';

      const text=document.createElement("div");
      const title=document.createElement("strong");
      const detail=document.createElement("small");

      title.textContent=place.name||place.display_name.split(",")[0];
      detail.textContent=place.display_name;

      text.append(title,detail);
      button.appendChild(text);

      button.addEventListener("click",()=>{
        box.classList.remove("show");
        $("searchInput").value=
          place.name||place.display_name.split(",")[0];

        selectPlace(place);
      });

      box.appendChild(button);
    });

  } catch(error) {
    if(id!==requestCounter) return;

    box.innerHTML=
      '<div class="suggestion">Search failed. Check your internet.</div>';
  }
}

document.addEventListener("click",event=>{
  if(!event.target.closest(".searchbar")) {
    $("suggestions").classList.remove("show");
  }
});

/* SELECT A SEARCH RESULT */

function selectPlace(place) {
  const coords=[Number(place.lon),Number(place.lat)];

  $("searchInput").value=
    place.name||place.display_name.split(",")[0];

  map.flyTo({
    center:coords,
    zoom:14,
    duration:1000
  });

  if(destinationMarker) destinationMarker.remove();

  destinationMarker=new maplibregl.Marker({color:"#ff4567"})
    .setLngLat(coords)
    .addTo(map);

  lastRoute={
    destinationName:place.name||place.display_name.split(",")[0],
    destinationCoords:coords
  };

  showStatus("Destination selected. Search a starting point or use GPS.");

  /*
   * To calculate a route, enter:
   * Start: Ropar
   * Destination: Chandigarh
   * and tap the destination suggestion.
   *
   * If GPS location is available, tap the GPS button first.
   */
}

/* FIND A PLACE BY NAME */

async function geocode(query) {
  const response=await fetch(
    "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q="+
    encodeURIComponent(query)
  );

  if(!response.ok) throw new Error("Location search failed.");

  const data=await response.json();

  if(!data.length) {
    throw new Error("Location not found: "+query);
  }

  return {
    name:data[0].name||data[0].display_name.split(",")[0],
    display:data[0].display_name,
    coords:[Number(data[0].lon),Number(data[0].lat)]
  };
}

/* CURRENT GPS LOCATION */

function useMyLocation() {
  if(!navigator.geolocation) {
    showStatus("GPS is not supported by this browser.");
    return;
  }

  showStatus("Finding your location...");

  navigator.geolocation.getCurrentPosition(position=>{
    currentPosition=[
      position.coords.longitude,
      position.coords.latitude
    ];

    if(currentMarker) currentMarker.remove();

    const element=document.createElement("div");
    element.className="location-dot";

    currentMarker=new maplibregl.Marker({element})
      .setLngLat(currentPosition)
      .addTo(map);

    map.flyTo({
      center:currentPosition,
      zoom:15,
      duration:1000
    });

    showStatus("Your current location is ready.");

    if(lastRoute) {
      askDestinationForRoute();
    }
  },error=>{
    showStatus(
      "Location permission required. Allow location access and try again."
    );
  },{
    enableHighAccuracy:true,
    timeout:20000,
    maximumAge:5000
  });
}

/* PROMPT FOR DESTINATION AFTER GPS */

function askDestinationForRoute() {
  const destination=prompt(
    "Enter your destination, for example Chandigarh:"
  );

  if(destination&&destination.trim()) {
    findRoute("__CURRENT__",destination.trim());
  }
}

/* ROUTE CALCULATION */

async function findRoute(startText,destinationText) {
  try {
    if(!destinationText) {
      showStatus("Please select a destination first.");
      return;
    }

    let start;

    if(startText==="__CURRENT__") {
      if(!currentPosition) {
        await new Promise((resolve,reject)=>{
          navigator.geolocation.getCurrentPosition(position=>{
            currentPosition=[
              position.coords.longitude,
              position.coords.latitude
            ];
            resolve();
          },reject,{
            enableHighAccuracy:true,
            timeout:15000
          });
        });
      }

      start={
        name:"Your location",
        coords:currentPosition
      };

    } else {
      start=await geocode(startText);
    }

    const destination=await geocode(destinationText);

    showStatus("Calculating your route...");

    const url=
      "https://router.project-osrm.org/route/v1/driving/"+
      start.coords.join(",")+";"+
      destination.coords.join(",")+
      "?overview=full&geometries=geojson&steps=true";

    const response=await fetch(url);

    if(!response.ok) {
      throw new Error("Route service unavailable.");
    }

    const data=await response.json();

    if(data.code!=="Ok"||!data.routes.length) {
      throw new Error("No route found.");
    }

    const route=data.routes[0];

    routeCoords=route.geometry.coordinates;

    lastRoute={
      startName:start.name,
      startCoords:start.coords,
      destinationName:destination.name,
      destinationCoords:destination.coords,
      route
    };

    map.getSource("routeSource").setData({
      type:"Feature",
      properties:{},
      geometry:route.geometry
    });

    if(destinationMarker) destinationMarker.remove();

    destinationMarker=new maplibregl.Marker({color:"#ff4567"})
      .setLngLat(destination.coords)
      .addTo(map);

    const bounds=new maplibregl.LngLatBounds();

    routeCoords.forEach(coord=>bounds.extend(coord));

    map.fitBounds(bounds,{
      padding:{
        top:170,
        bottom:160,
        left:35,
        right:35
      },
      duration:1100
    });

    const km=(route.distance/1000).toFixed(1);
    const mins=Math.max(1,Math.round(route.duration/60));

    $("routeDistance").textContent=km+" km";
    $("routeTime").textContent=
      mins>=60
        ?Math.floor(mins/60)+" hr "+(mins%60)+" min"
        :mins+" min";

    $("routeCard").classList.add("show");

    $("navDirection").textContent=
      "Route to "+destination.name+
      ". Distance "+km+" km. Estimated time "+mins+" minutes.";

    showStatus("Route ready.");

  } catch(error) {
    showStatus(error.message||"Unable to calculate route.");
  }
}

/* NAVIGATION MODE */

function startNavigation() {
  if(!routeCoords.length) {
    showStatus("Search a destination and calculate a route first.");
    return;
  }

  navigationOn=true;

  $("navigationPanel").classList.add("show");

  $("navDirection").textContent=
    "Follow the blue route to "+(lastRoute?.destinationName||"your destination")+
    ". Keep GPS enabled for live location.";

  if(navigator.geolocation) {
    if(routeWatchId!==null) {
      navigator.geolocation.clearWatch(routeWatchId);
    }

    routeWatchId=navigator.geolocation.watchPosition(position=>{
      currentPosition=[
        position.coords.longitude,
        position.coords.latitude
      ];

      if(!currentMarker) {
        const element=document.createElement("div");
        element.className="location-dot";

        currentMarker=new maplibregl.Marker({element})
          .setLngLat(currentPosition)
          .addTo(map);
      } else {
        currentMarker.setLngLat(currentPosition);
      }

      if(navigationOn) {
        map.easeTo({
          center:currentPosition,
          duration:700
        });
      }

    },()=>{},{
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:15000
    });
  }

  showStatus("Navigation started.");
}

function stopNavigation() {
  navigationOn=false;

  $("navigationPanel").classList.remove("show");

  if(routeWatchId!==null&&navigator.geolocation) {
    navigator.geolocation.clearWatch(routeWatchId);
    routeWatchId=null;
  }

  showStatus("Navigation closed.");
}

/* MAP STYLE SWITCH */

function toggleMapType() {
  if(!map.getLayer("satelliteLayer")) return;

  satelliteOn=!satelliteOn;

  map.setLayoutProperty(
    "satelliteLayer",
    "visibility",
    satelliteOn?"visible":"none"
  );

  $("layersBtn").classList.toggle("active",satelliteOn);

  showStatus(satelliteOn?"Satellite view enabled.":"Default map enabled.");
}

/* TRAFFIC SWITCH */

function toggleTraffic() {
  if(!map.getLayer("trafficLayer")) return;

  trafficOn=!trafficOn;

  map.setLayoutProperty(
    "trafficLayer",
    "visibility",
    trafficOn?"visible":"none"
  );

  showStatus(
    trafficOn
      ?"Traffic layer enabled. A valid TomTom API key is required."
      :"Traffic layer disabled."
  );
}

/* TOP BUTTONS */

function setTab(tab) {
  ["explore","saved","food"].forEach(name=>{
    $(name+"Chip").classList.toggle("active",name===tab);
  });

  if(tab==="food") {
    $("searchInput").value="Restaurants";
    $("searchInput").dispatchEvent(new Event("input"));
    $("searchInput").focus();
  } else if(tab==="saved") {
    showStatus("Saved places can be added in a future update.");
  } else {
    showStatus("Explore places with RouteX.");
  }
}

/* VOICE SEARCH */

function voiceSearch() {
  const SpeechRecognition=
    window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SpeechRecognition) {
    showStatus("Voice search is unavailable. Type your search instead.");
    return;
  }

  const recognition=new SpeechRecognition();

  recognition.lang="en-IN";

  recognition.onresult=event=>{
    const text=event.results[0][0].transcript;

    $("searchInput").value=text;

    $("searchInput").dispatchEvent(new Event("input"));
  };

  recognition.onerror=()=>{
    showStatus("Voice search could not start.");
  };

  recognition.start();
}

/* OPTIONAL KEYBOARD SHORTCUT */
document.addEventListener("keydown",event=>{
  if(event.key==="Escape") {
    stopNavigation();
    $("suggestions").classList.remove("show");
  }
});
</script>
