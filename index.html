<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>RouteX 3D Navigation</title>

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
      rel="stylesheet">

<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
:root {
  --bg: #071525;
  --panel: rgba(8, 25, 44, .94);
  --border: rgba(130, 183, 224, .25);
  --blue: #1685ff;
  --cyan: #42e6d0;
  --text: #f5f8ff;
  --muted: #bdcde0;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

#map {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* Top floating panel */

.top-panel {
  position: fixed;
  top: max(10px, env(safe-area-inset-top));
  left: 12px;
  right: 12px;
  z-index: 10;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--panel);
  box-shadow: 0 8px 30px #0005;
  backdrop-filter: blur(18px);
}

.brand-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.brand {
  font-size: 23px;
  font-weight: 850;
  letter-spacing: -.6px;
}

.brand span {
  color: var(--cyan);
}

.tagline {
  color: var(--muted);
  font-size: 11px;
  margin-top: 3px;
}

button {
  color: white;
  border: 1px solid #4c7097;
  background: #183858;
  font-weight: 700;
  cursor: pointer;
  border-radius: 12px;
}

button:active {
  transform: scale(.98);
}

.gps-btn {
  padding: 11px 12px;
  white-space: nowrap;
  font-size: 12px;
  background: #124d75;
  border-color: #2d94ca;
}

.search-row {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.input-wrap {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 11px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #10263d;
}

.input-wrap .dot {
  font-size: 13px;
  color: var(--cyan);
}

.input-wrap input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: none;
  padding: 12px 0;
  color: white;
  background: transparent;
  font-size: 14px;
}

.input-wrap input::placeholder {
  color: #9dafc4;
}

.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 9px;
}

.action-row button {
  padding: 12px 5px;
  font-size: 13px;
}

.primary {
  background: var(--blue);
  border-color: #4ba1ff;
}

.secondary {
  background: #183858;
}

/* Right-side floating map buttons */

.map-buttons {
  position: fixed;
  right: 13px;
  top: 48%;
  transform: translateY(-50%);
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.map-buttons button {
  width: 46px;
  height: 46px;
  font-size: 19px;
  background: rgba(8, 25, 44, .94);
  border-radius: 15px;
  box-shadow: 0 4px 16px #0004;
}

.map-buttons .gps-circle {
  color: var(--cyan);
}

/* Bottom floating route card */

.bottom-card {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: max(12px, env(safe-area-inset-bottom));
  z-index: 8;
  padding: 15px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 19px;
  box-shadow: 0 8px 30px #0005;
  backdrop-filter: blur(18px);
}

.route-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.route-title {
  font-size: 16px;
  font-weight: 800;
}

.route-time {
  color: var(--cyan);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.route-subtitle {
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
}

.status {
  margin-top: 10px;
  color: var(--cyan);
  font-size: 12px;
  line-height: 1.4;
}

.bottom-actions {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  margin-top: 11px;
}

.bottom-actions button {
  padding: 13px 12px;
  font-size: 14px;
}

#stopBtn {
  display: none;
  background: #642b37;
  border-color: #a94c5b;
}

/* Turn instruction banner */

.turn-card {
  position: fixed;
  left: 12px;
  right: 12px;
  top: 200px;
  z-index: 6;
  display: none;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--panel);
  box-shadow: 0 6px 22px #0004;
  pointer-events: none;
}

.turn-title {
  font-size: 14px;
  font-weight: 800;
}

.turn-distance {
  margin-top: 4px;
  color: var(--cyan);
  font-size: 12px;
}

#message {
  overflow-wrap: anywhere;
}

/* Wider screens */

@media (min-width: 700px) {
  .top-panel {
    top: 20px;
    left: 20px;
    right: auto;
    width: 390px;
  }

  .bottom-card {
    left: 20px;
    right: auto;
    bottom: 20px;
    width: 390px;
  }

  .turn-card {
    top: 200px;
    left: 20px;
    right: auto;
    width: 390px;
  }

  .map-buttons {
    right: 22px;
  }
}

/* Compact phone layout */

@media (max-width: 380px) {
  .top-panel {
    padding: 10px;
    left: 8px;
    right: 8px;
  }

  .brand {
    font-size: 20px;
  }

  .gps-btn {
    padding: 9px;
    font-size: 11px;
  }

  .input-wrap input {
    font-size: 13px;
  }

  .bottom-card {
    left: 8px;
    right: 8px;
    bottom: max(8px, env(safe-area-inset-bottom));
    padding: 12px;
  }

  .turn-card {
    left: 8px;
    right: 8px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<!-- Floating search panel -->
<div class="top-panel">

  <div class="brand-row">
    <div>
      <div class="brand">📍 RouteX <span>3D</span></div>
      <div class="tagline">Live GPS · Real Roads · Navigation</div>
    </div>

    <button class="gps-btn" onclick="startGPS()">
      📍 Live GPS
    </button>
  </div>

  <div class="search-row">

    <div class="input-wrap">
      <span class="dot">●</span>
      <input id="start" value="Ropar, Punjab, India"
             placeholder="Starting location">
    </div>

    <div class="input-wrap">
      <span style="color:#ff7777">●</span>
      <input id="destination" value="Kurali, Punjab, India"
             placeholder="Where to?">
    </div>

  </div>

  <div class="action-row">
    <button class="primary" onclick="findRoute()">
      ➤ Find Route
    </button>

    <button class="secondary" onclick="toggle3D()">
      🏙️ Switch 2D / 3D
    </button>
  </div>
</div>

<!-- Floating right-side controls -->
<div class="map-buttons">
  <button class="gps-circle" onclick="startGPS()" title="My location">◎</button>
  <button onclick="zoomIn()" title="Zoom in">＋</button>
  <button onclick="zoomOut()" title="Zoom out">－</button>
</div>

<!-- Turn instruction -->
<div class="turn-card" id="turnCard">
  <div class="turn-title" id="turnTitle">Route ready</div>
  <div class="turn-distance" id="turnDistance"></div>
</div>

<!-- Bottom floating route information -->
<div class="bottom-card">

  <div class="route-heading">
    <div class="route-title" id="routeTitle">RouteX Navigation</div>
    <div class="route-time" id="routeTime">Find a route</div>
  </div>

  <div class="route-subtitle" id="routeSubtitle">
    Enter your destination to get directions.
  </div>

  <div class="status" id="message">
    Connecting to map...
  </div>

  <div class="bottom-actions">
    <button class="primary" id="startNavBtn" onclick="startNavigation()">
      ▶ Start Navigation
    </button>

    <button id="stopBtn" onclick="stopNavigation()">
      ■ Stop
    </button>
  </div>

</div>

<script>
/* ---------------------------------
   ROUTEX MAP
---------------------------------- */

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [76.53, 30.97],
  zoom: 10,
  pitch: 48,
  bearing: 0,
  antialias: true
});

map.addControl(
  new maplibregl.NavigationControl({
    showCompass: true,
    showZoom: false,
    visualizePitch: true
  }),
  'bottom-right'
);

let routeCoordinates = [];
let routeSteps = [];
let currentRoute = null;

let gpsWatch = null;
let gpsMarker = null;
let carMarker = null;

let gpsPosition = null;
let navigationActive = false;
let is3D = true;
let routeLayerReady = false;

const $ = id => document.getElementById(id);

function setMessage(text) {
  $('message').textContent = text;
}

map.on('load', () => {
  setMessage('Map ready. Enter a destination and find your route.');

  map.addSource('routeSource', {
    type: 'geojson',
    data: {
      type: 'FeatureCollection',
      features: []
    }
  });

  map.addLayer({
    id: 'routeGlow',
    type: 'line',
    source: 'routeSource',
    layout: {
      'line-join': 'round',
      'line-cap': 'round'
    },
    paint: {
      'line-color': '#51aaff',
      'line-width': 11,
      'line-opacity': 0.25
    }
  });

  map.addLayer({
    id: 'routeLine',
    type: 'line',
    source: 'routeSource',
    layout: {
      'line-join': 'round',
      'line-cap': 'round'
    },
    paint: {
      'line-color': '#087cff',
      'line-width': 6
    }
  });

  routeLayerReady = true;
});

/* ---------------------------------
   LOCATION SEARCH
---------------------------------- */

async function geocode(place) {
  const url =
    'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='
    + encodeURIComponent(place);

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error('Location search failed. Try again.');
  }

  const data = await response.json();

  if (!data.length) {
    throw new Error('Location not found: ' + place);
  }

  return [
    Number(data[0].lon),
    Number(data[0].lat)
  ];
}

/* ---------------------------------
   FIND ROAD ROUTE
---------------------------------- */

async function findRoute() {
  if (!map.isStyleLoaded() || !routeLayerReady) {
    setMessage('Map is still loading. Please wait...');
    return;
  }

  const startText = $('start').value.trim();
  const endText = $('destination').value.trim();

  if (!startText || !endText) {
    setMessage('Please enter both starting point and destination.');
    return;
  }

  setMessage('Finding real roads and calculating route...');
  $('routeTitle').textContent = 'Searching...';
  $('routeTime').textContent = 'Please wait';

  try {
    const startPoint = await geocode(startText);
    const endPoint = await geocode(endText);

    const url =
      'https://router.project-osrm.org/route/v1/driving/'
      + startPoint.join(',')
      + ';'
      + endPoint.join(',')
      + '?overview=full&geometries=geojson&steps=true&alternatives=true';

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error('Routing service is unavailable.');
    }

    const data = await response.json();

    if (data.code !== 'Ok' || !data.routes.length) {
      throw new Error('No driving route found for these locations.');
    }

    currentRoute = data.routes[0];
    routeCoordinates = currentRoute.geometry.coordinates;

    routeSteps = [];

    currentRoute.legs.forEach(leg => {
      leg.steps.forEach(step => {
        routeSteps.push(step);
      });
    });

    map.getSource('routeSource').setData({
      type: 'Feature',
      properties: {},
      geometry: currentRoute.geometry
    });

    const bounds = new maplibregl.LngLatBounds();

    routeCoordinates.forEach(point => bounds.extend(point));

    map.fitBounds(bounds, {
      padding: {
        top: 190,
        bottom: 190,
        left: 35,
        right: 35
      },
      duration: 1200,
      maxZoom: 15
    });

    const distanceKm = currentRoute.distance / 1000;
    const minutes = Math.round(currentRoute.duration / 60);

    $('routeTitle').textContent = 'Route ready';
    $('routeTime').textContent =
      distanceKm.toFixed(1) + ' km · ' + minutes + ' min';

    $('routeSubtitle').textContent =
      startText + ' → ' + endText;

    setMessage('Route found. Start navigation when ready.');

    $('turnCard').style.display = 'none';

  } catch (error) {
    setMessage(error.message || 'Could not find route. Check your internet.');
    $('routeTitle').textContent = 'Route unavailable';
    $('routeTime').textContent = 'Try again';
  }
}

/* ---------------------------------
   2D / 3D
---------------------------------- */

function toggle3D() {
  is3D = !is3D;

  map.easeTo({
    pitch: is3D ? 58 : 0,
    bearing: is3D ? map.getBearing() : 0,
    duration: 900
  });

  setMessage(is3D ? '3D view enabled.' : '2D map enabled.');
}

function zoomIn() {
  map.zoomIn({ duration: 250 });
}

function zoomOut() {
  map.zoomOut({ duration: 250 });
}

/* ---------------------------------
   LIVE GPS
---------------------------------- */

function startGPS() {
  if (!navigator.geolocation) {
    setMessage('GPS is not supported by this browser.');
    return;
  }

  if (!window.isSecureContext) {
    setMessage('GPS needs HTTPS. Open your GitHub Pages website.');
    return;
  }

  setMessage('Requesting location permission...');

  navigator.geolocation.getCurrentPosition(
    position => {
      gpsPosition = [
        position.coords.longitude,
        position.coords.latitude
      ];

      showGPSMarker(gpsPosition);

      map.flyTo({
        center: gpsPosition,
        zoom: 16,
        pitch: is3D ? 58 : 0,
        duration: 1200
      });

      setMessage('Your location found. GPS is ready.');

      if (gpsWatch === null) {
        gpsWatch = navigator.geolocation.watchPosition(
          onGPSUpdate,
          onGPSError,
          {
            enableHighAccuracy: true,
            maximumAge: 2000,
            timeout: 15000
          }
        );
      }
    },
    onGPSError,
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 1000
    }
  );
}

function showGPSMarker(coords) {
  if (!gpsMarker) {
    const el = document.createElement('div');

    el.style.width = '17px';
    el.style.height = '17px';
    el.style.borderRadius = '50%';
    el.style.background = '#1685ff';
    el.style.border = '4px solid white';
    el.style.boxShadow = '0 0 0 8px #1685ff33';

    gpsMarker = new maplibregl.Marker({
      element: el
    }).setLngLat(coords).addTo(map);
  } else {
    gpsMarker.setLngLat(coords);
  }
}

function onGPSUpdate(position) {
  gpsPosition = [
    position.coords.longitude,
    position.coords.latitude
  ];

  showGPSMarker(gpsPosition);

  if (navigationActive) {
    updateNavigation();
  }
}

function onGPSError(error) {
  const messages = {
    1: 'Location permission denied. Allow location access in browser settings.',
    2: 'Your location is unavailable. Check GPS settings.',
    3: 'GPS timed out. Try again.'
  };

  setMessage(messages[error.code] || 'Unable to access GPS.');
}

/* ---------------------------------
   START / STOP NAVIGATION
---------------------------------- */

function startNavigation() {
  if (!currentRoute) {
    setMessage('First enter locations and tap Find Route.');
    return;
  }

  navigationActive = true;

  $('startNavBtn').textContent = '● Navigation Active';
  $('stopBtn').style.display = 'block';
  $('turnCard').style.display = 'block';

  if (!gpsPosition) {
    setMessage('Navigation started. Allow GPS to follow your position.');
    startGPS();
  } else {
    setMessage('Live navigation active.');
    updateNavigation();
  }
}

function stopNavigation() {
  navigationActive = false;

  $('startNavBtn').textContent = '▶ Start Navigation';
  $('stopBtn').style.display = 'none';
  $('turnCard').style.display = 'none';

  setMessage('Navigation stopped.');
}

/* ---------------------------------
   BASIC ROUTE PROGRESS
---------------------------------- */

function distanceBetween(a, b) {
  const R = 6371000;

  const rad = value => value * Math.PI / 180;

  const lat1 = rad(a[1]);
  const lat2 = rad(b[1]);

  const dLat = rad(b[1] - a[1]);
  const dLon = rad(b[0] - a[0]);

  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1) * Math.cos(lat2) *
    Math.sin(dLon / 2) ** 2;

  return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

function updateNavigation() {
  if (!gpsPosition || !routeCoordinates.length) return;

  let nearestIndex = 0;
  let nearestDistance = Infinity;

  for (let i = 0; i < routeCoordinates.length; i++) {
    const distance = distanceBetween(
      gpsPosition,
      routeCoordinates[i]
    );

    if (distance < nearestDistance) {
      nearestDistance = distance;
      nearestIndex = i;
    }
  }

  const remainingCoordinates =
    routeCoordinates.slice(nearestIndex);

  let remainingMeters = 0;

  for (let i = 1; i < remainingCoordinates.length; i++) {
    remainingMeters += distanceBetween(
      remainingCoordinates[i - 1],
      remainingCoordinates[i]
    );
  }

  const remainingKm = remainingMeters / 1000;

  $('routeTitle').textContent =
    remainingKm < 0.05 ? 'Destination reached!' : 'Navigation active';

  $('routeTime').textContent =
    remainingKm.toFixed(1) + ' km remaining';

  if (routeSteps.length) {
    let nextStep = routeSteps[0];

    for (const step of routeSteps) {
      if (step.distance > 10) {
        nextStep = step;
        break;
      }
    }

    const instruction =
      nextStep.maneuver &&
      nextStep.maneuver.type === 'arrive'
        ? 'You are approaching your destination'
        : (nextStep.name
            ? 'Continue towards ' + nextStep.name
            : 'Continue along the route');

    $('turnTitle').textContent = '🧭 ' + instruction;

    $('turnDistance').textContent =
      'Nearest route point: ' +
      Math.round(nearestDistance) + ' m away';
  }

  if (navigationActive && nearestDistance < 100) {
    map.easeTo({
      center: gpsPosition,
      pitch: is3D ? 58 : 0,
      duration: 500
    });
  }
}

/* ---------------------------------
   CLEANUP
---------------------------------- */

window.addEventListener('beforeunload', () => {
  if (gpsWatch !== null) {
    navigator.geolocation.clearWatch(gpsWatch);
  }
});
</script>

</body>
</html>
